<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>408 考研知识库</title>
  <style>
    :root { --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb; --bg:#f8fafc;
            --brand:#1d4ed8; --ok:#047857; --warn:#b45309; --card:#fff; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--ink);
           font:16px/1.65 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
    header { padding:28px 20px 10px; max-width:820px; margin:0 auto; }
    h1 { margin:0 0 6px; font-size:22px; }
    .sub { color:var(--muted); font-size:14px; }
    main { max-width:820px; margin:0 auto; padding:16px 20px 60px; }
    .box { background:var(--card); border:1px solid var(--line); border-radius:12px;
           padding:16px; box-shadow:0 1px 2px rgba(0,0,0,.03); }
    textarea { width:100%; min-height:88px; resize:vertical; border:1px solid var(--line);
               border-radius:8px; padding:10px 12px; font:inherit; outline:none; }
    textarea:focus { border-color:var(--brand); }
    .row { display:flex; gap:10px; align-items:center; margin-top:12px; flex-wrap:wrap; }
    #auth { margin:0 0 10px; }
    #auth input { flex:1; min-width:180px; border:1px solid var(--line); border-radius:8px;
                  padding:7px 10px; font:inherit; outline:none; }
    #auth input:focus { border-color:var(--brand); }
    #auth label { font-size:13px; color:var(--muted); }
    button { background:var(--brand); color:#fff; border:0; border-radius:8px;
             padding:9px 18px; font:inherit; cursor:pointer; }
    button:disabled { opacity:.5; cursor:wait; }
    .examples { margin-left:auto; color:var(--muted); font-size:13px; }
    .examples a { color:var(--brand); text-decoration:none; cursor:pointer; }
    #result { margin-top:18px; display:none; }
    .badge { display:inline-block; font-size:12px; padding:2px 8px; border-radius:999px;
             margin-bottom:10px; }
    .badge.ok { background:#ecfdf5; color:var(--ok); }
    .badge.no { background:#fffbeb; color:var(--warn); }
    .answer { white-space:pre-wrap; margin:4px 0 14px; }
    h2 { font-size:14px; color:var(--muted); margin:18px 0 8px; font-weight:600; }
    .cite { border-left:3px solid var(--brand); padding:6px 10px; margin:8px 0;
            background:#f8faff; border-radius:0 6px 6px 0; font-size:14px; }
    .cite .id { color:var(--brand); font-weight:600; margin-right:6px; }
    .hit { border-top:1px dashed var(--line); padding:8px 0; font-size:14px; }
    .hit:first-child { border-top:0; }
    .hit .meta { color:var(--muted); font-size:12px; }
    .err { color:#b91c1c; font-size:14px; }
    .loading { display:flex; align-items:center; gap:9px; margin-top:14px;
               color:var(--muted); font-size:14px; }
    .spinner { width:15px; height:15px; border:2px solid var(--line);
               border-top-color:var(--brand); border-radius:50%;
               animation:spin .8s linear infinite; flex:none; }
    @keyframes spin { to { transform:rotate(360deg); } }
    footer { color:var(--muted); font-size:12px; text-align:center; padding:0 20px 30px; }
  </style>
</head>
<body>
<header>
  <h1>408 考研知识库</h1>
  <div class="sub">答案只来自题库原文；引用可逐条核对。资料没覆盖时会明确拒答。</div>
</header>
<main>
  <div class="box">
    <div class="row" id="auth" style="display:none;margin-top:0">
      <label for="token">访问口令</label>
      <input id="token" type="password" autocomplete="current-password"
             placeholder="输入后自动保存在本机">
    </div>
    <textarea id="q" placeholder="例如：二级页式存储的虚拟地址怎么拆成页目录号和页号？"></textarea>
    <div class="row">
      <button id="ask">提问</button>
      <span class="examples">试试：<a data-q="CSMA/CD 最小帧长和单向传播时延">CSMA/CD</a> ·
        <a data-q="LRU 页置换 缺页次数">LRU</a> ·
        <a data-q="哈夫曼树 115 个结点 叶子结点">哈夫曼</a></span>
    </div>
    <div id="loading" class="loading" style="display:none" aria-live="polite">
      <span class="spinner"></span>
      <span id="loading-text">正在检索真题并生成答案，通常需要 10~15 秒…</span>
    </div>
    <div id="err" class="err"></div>
  </div>
  <div id="result" class="box">
    <span id="badge" class="badge"></span>
    <div id="answer" class="answer"></div>
    <div id="cites"></div>
    <h2 id="hits-title">召回的原题</h2>
    <div id="hits"></div>
    <div id="latency" class="meta" style="color:var(--muted);font-size:12px;margin-top:10px"></div>
  </div>
</main>
<footer>仅使用公开真题原文；解析自行整理。个人学习交流用途。</footer>
<script>
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  };

  document.querySelectorAll('.examples a').forEach(a => {
    a.addEventListener('click', () => { $('q').value = a.dataset.q; $('q').focus(); });
  });
  $('q').addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') ask();
  });
  $('ask').addEventListener('click', ask);

  const TOKEN_KEY = '408-access-token';
  const getToken = () => localStorage.getItem(TOKEN_KEY) || '';
  $('token').value = getToken();
  $('token').addEventListener('input', () => {
    localStorage.setItem(TOKEN_KEY, $('token').value.trim());
  });

  fetch('/health').then(r => r.json()).then(h => {
    if (h.auth_required) {
      $('auth').style.display = 'flex';
      if (!getToken()) $('token').focus();
    }
  }).catch(() => {});

  let loadingTimer = null;
  function startLoading() {
    $('loading').style.display = 'flex';
    $('ask').textContent = '生成中…';
    const started = Date.now();
    $('loading-text').textContent = '正在检索真题并生成答案，通常需要 10~15 秒…';
    loadingTimer = setInterval(() => {
      const s = Math.floor((Date.now() - started) / 1000);
      $('loading-text').textContent =
        '正在检索真题并生成答案…已等待 ' + s + ' 秒（首次加载模型会更久）';
    }, 1000);
  }
  function stopLoading() {
    clearInterval(loadingTimer);
    loadingTimer = null;
    $('loading').style.display = 'none';
    $('ask').textContent = '提问';
  }

  async function ask() {
    const query = $('q').value.trim();
    if (!query) return;
    $('ask').disabled = true;
    $('err').textContent = '';
    startLoading();
    const headers = {'Content-Type': 'application/json'};
    const token = getToken();
    if (token) headers['X-Access-Token'] = token;
    try {
      const resp = await fetch('/ask', {
        method: 'POST', headers, body: JSON.stringify({query})
      });
      if (!resp.ok) {
        const data = await resp.json().catch(() => null);
        if (resp.status === 401) {
          $('auth').style.display = 'flex';
          $('token').focus();
        }
        throw new Error((data && data.detail) || ('HTTP ' + resp.status));
      }
      render(await resp.json());
    } catch (e) {
      $('err').textContent = '请求失败：' + e.message;
    } finally {
      stopLoading();
      $('ask').disabled = false;
    }
  }

  function render(data) {
    $('result').style.display = 'block';
    const badge = $('badge');
    if (data.refused) {
      badge.className = 'badge no';
      badge.textContent = '未作答 · ' + (data.reason || '资料未覆盖');
    } else {
      badge.className = 'badge ok';
      badge.textContent = '已作答 · 引用已校验';
    }
    $('answer').textContent = data.refused
      ? '题库里没有足够依据回答这个问题。可以换个问法，或补充相关真题。'
      : data.answer;

    const cites = $('cites');
    cites.replaceChildren();
    if (data.citations && data.citations.length) {
      cites.appendChild(el('h2', null, '引用'));
      data.citations.forEach(c => {
        const div = el('div', 'cite');
        div.appendChild(el('span', 'id', '[' + c.chunk_id + ']'));
        div.appendChild(document.createTextNode(c.quote));
        cites.appendChild(div);
      });
    }

    const hits = $('hits');
    hits.replaceChildren();
    (data.hits || []).forEach(h => {
      const div = el('div', 'hit');
      div.appendChild(el('div', 'meta', h.chunk_id + ' · ' + (h.subject || '未分类') + ' · score ' + h.score));
      div.appendChild(el('div', null, h.stem + (h.stem.length >= 120 ? '…' : '')));
      hits.appendChild(div);
    });
    $('latency').textContent = '耗时 ' + data.latency_ms + ' ms · 生成尝试 ' + data.attempts + ' 次';
  }
</script>
</body>
</html>
