  function userMessage(msg) {
    const row = el('div', 'msg user');
    row.appendChild(el('div', 'user-bubble', msg.content));
    return row;
  }

  function answerText(data) {
    if (data.intent === 'chitchat' || data.intent === 'clarify') return data.answer || '';
    if (!data.refused) return data.answer || '';
    if (data.answer) return data.answer;
    if (data.reason === 'provider_error' || (data.reason || '').indexOf('provider_error') === 0) {
      return '生成服务暂时不可用，请稍后再试。';
    }
    if ((data.reason || '').indexOf('citation_failed') === 0) {
      return '生成的答案没能逐字对上题库原文，已按规则拒答。可以换个问法再试。';
    }
    return '真题和考点里都没有足够依据回答这个问题。可以换个问法，或补充相关资料。';
  }

  function badgeFor(data) {
    if (data.intent === 'chitchat') return ['badge neutral', '闲聊'];
    if (data.intent === 'clarify') return ['badge neutral', '需要补充'];
    if (data.refused) {
      let reason = '资料未覆盖';
      if ((data.reason || '').indexOf('low_score') === 0) reason = '召回分数不足';
      else if ((data.reason || '').indexOf('low_margin') === 0) reason = '候选区分度不足';
      else if ((data.reason || '').indexOf('citation_failed') === 0) reason = '引用校验未通过';
      else if ((data.reason || '').indexOf('provider_error') === 0) reason = '生成服务异常';
      return ['badge no', '未作答 · ' + reason];
    }
    return ['badge', '已作答 · 引用已校验'];
  }

  function renderBotMessage(msg) {
    const row = el('div', 'msg bot');
    row.appendChild(el('div', 'avatar', '408'));
    const body = el('div', 'bot-body');
    const data = msg.data || {};

    if (msg.error) {
      const line = el('div', 'badge-line');
      line.appendChild(el('span', 'badge err', '请求失败'));
      body.appendChild(line);
      const card = el('div', 'answer-card');
      card.appendChild(el('div', 'answer-text', msg.error));
      body.appendChild(card);
      row.appendChild(body);
      return row;
    }

    const b = badgeFor(data);
    const line = el('div', 'badge-line');
    line.appendChild(el('span', b[0], b[1]));
    const bits = [];
    if (data.latency_ms) bits.push((data.latency_ms / 1000).toFixed(1) + ' 秒');
    if (data.attempts) bits.push('生成 ' + data.attempts + ' 次');
    if (bits.length) line.appendChild(el('span', 'badge-meta', bits.join(' · ')));
    body.appendChild(line);

    const card = el('div', 'answer-card');
    card.appendChild(el('div', 'answer-text', answerText(data)));

    if (data.citations && data.citations.length) {
      card.appendChild(el('div', 'section-title', '引用'));
      data.citations.forEach(c => {
        const cite = el('div', 'cite');
        const head = el('div', 'cite-head');
        head.appendChild(el('span', 'cite-id', '[' + c.chunk_id + ']'));
        head.appendChild(el('span', 'q-tag' + (isKnowledge(c) ? ' k-tag' : ''),
          isKnowledge(c) ? '考点' : '真题'));
        if (isKnowledge(c) && c.title) head.appendChild(el('span', 'badge-meta', c.title));
        const btn = el('button', 'link-btn', isKnowledge(c) ? '查看考点' : '查看原题');
        btn.addEventListener('click', () => openSource(c));
        head.appendChild(btn);
        cite.appendChild(head);
        cite.appendChild(el('div', 'cite-quote', '“' + (c.quote || '') + '”'));
        card.appendChild(cite);
      });
    }

    if (data.rewritten_query) {
      const rw = el('div', 'rewrite');
      rw.appendChild(document.createTextNode('检索时使用：'));
      rw.appendChild(el('b', null, data.rewritten_query));
      card.appendChild(rw);
    }

    if (data.hits && data.hits.length) {
      const kn = data.hits.filter(isKnowledge).length;
      const qn = data.hits.length - kn;
      const label = kn && qn ? '召回的真题与考点' : (kn ? '召回的考点' : '召回的原题');
      const det = el('details');
      det.appendChild(el('summary', null, label + '（' + data.hits.length + '）'));
      const list = el('div', 'hit-list');
      data.hits.forEach(h => {
        const item = el('div', 'hit-item');
        item.appendChild(el('div', 'hit-score', Number(h.score).toFixed(3)));
        const main = el('div', 'hit-main');
        const btn = el('button');
        btn.appendChild(el('div', 'hit-stem', h.stem));
        const bits = [h.chunk_id];
        if (isKnowledge(h)) {
          bits.push('考点');
          if (h.chapter) bits.push(h.chapter);
        } else {
          bits.push(subjectLabel(h.subject));
          if (h.answer) bits.push('参考答案 ' + h.answer);
        }
        btn.appendChild(el('div', 'hit-meta', bits.join(' · ')));
        btn.addEventListener('click', () => openSource(h));
        main.appendChild(btn);
        item.appendChild(main);
        list.appendChild(item);
      });
      det.appendChild(list);
      card.appendChild(det);
    }

    if (data.trace && data.trace.steps && data.trace.steps.length) {
      const det = el('details');
      det.appendChild(el('summary', null, '执行过程'));
      const trace = el('div', 'trace');
      data.trace.steps.forEach(s => {
        const r = el('div', 'trace-row');
        r.appendChild(el('div', 'trace-name', s.name));
        r.appendChild(el('div', 'trace-ms', s.ms ? s.ms + 'ms' : '—'));
        r.appendChild(el('div', 'trace-detail', s.detail || ''));
        trace.appendChild(r);
      });
      det.appendChild(trace);
      card.appendChild(det);
    }

    body.appendChild(card);
    row.appendChild(body);
    return row;
  }

  function loadingBubble() {
    const row = el('div', 'msg bot');
    row.appendChild(el('div', 'avatar', '408'));
    const body = el('div', 'bot-body');
    const box = el('div', 'typing');
    box.appendChild(el('span', 'spinner'));
    const text = el('span', null, '正在检索真题与考点并生成答案…');
    text.id = 'loading-text';
    box.appendChild(text);
    body.appendChild(box);
    row.appendChild(body);
    return row;
  }

  function startLoadingTimer() {
    state.loadingStart = Date.now();
    stopLoadingTimer();
    state.loadingTimer = setInterval(() => {
      const node = $('#loading-text');
      if (!node) return;
      const s = Math.floor((Date.now() - state.loadingStart) / 1000);
      node.textContent = '正在检索真题与考点并生成答案…已等待 ' + s + ' 秒（首次加载模型会更久）';
    }, 1000);
  }

  function stopLoadingTimer() {
    if (state.loadingTimer) {
      clearInterval(state.loadingTimer);
      state.loadingTimer = null;
    }
  }

  function renderMessages() {
    const box = $('#messages');
    if (!box) return;
    box.replaceChildren();
    const conv = activeConv();
    if (!conv || (!conv.messages.length && !state.sending)) {
      box.appendChild(emptyState());
      return;
    }
    conv.messages.forEach(m => {
      box.appendChild(m.role === 'user' ? userMessage(m) : renderBotMessage(m));
    });
    if (state.sending) box.appendChild(loadingBubble());
    requestAnimationFrame(() => { box.scrollTop = box.scrollHeight; });
  }

  function historyFor(conv) {
    return conv.messages.slice(-6).map(m => {
      if (m.role === 'user') return {role: 'user', content: m.content};
      const d = m.data || {};
      return {
        role: 'assistant',
        content: d.answer || (d.refused ? '（未作答：' + (d.reason || '资料不足') + '）' : '')
      };
    }).filter(m => m.content);
  }

  async function send() {
    const input = $('#composer');
    const text = input.value.trim();
    if (!text || state.sending) return;
    if (state.health && state.health.auth_required && !state.token) {
      showAuthNeeded('请先输入访问口令。');
      return;
    }
    let conv = activeConv();
    if (!conv) conv = newConversation();
    const history = historyFor(conv);

    input.value = '';
    autoGrow();
    conv.messages.push({role: 'user', content: text, ts: Date.now()});
    conv.updatedAt = Date.now();
    if (conv.title === '新对话') conv.title = text.replace(/\s+/g, ' ').slice(0, 22);
    state.sending = true;
    startLoadingTimer();
    renderConvList();
    renderMessages();
    saveConvs();

    $('#send').disabled = true;
    try {
      const data = await api('/chat', {
        method: 'POST',
        body: {query: text, history: history}
      });
      conv.messages.push({role: 'assistant', data: data, ts: Date.now()});
      conv.updatedAt = Date.now();
    } catch (e) {
      conv.messages.pop();
      input.value = text;
      autoGrow();
      if (e.status === 401) {
        showAuthNeeded('访问口令无效或已过期，请重新输入。');
      } else if (e.status === 429) {
        toast('请求太频繁，' + (e.message || '请稍后再试'), 'err');
      } else {
        toast('请求失败：' + e.message, 'err');
      }
    } finally {
      state.sending = false;
      stopLoadingTimer();
      $('#send').disabled = false;
      renderMessages();
      renderConvList();
      saveConvs();
      input.focus();
    }
  }

  function autoGrow() {
    const t = $('#composer');
    t.style.height = 'auto';
    t.style.height = Math.min(t.scrollHeight, 150) + 'px';
  }

  /* ---------- question bank ---------- */
  async function ensureMeta(silent) {
    if (state.meta) return state.meta;
    try {
      state.meta = await api('/meta');
      renderSubjects();
      renderPracticeSubjects();
      const facts = $('#side-facts');
      if (facts) {
        facts.textContent = state.meta.years.join(' / ') + ' 真题 · ' +
          state.meta.chunks + ' 题 · ' + state.meta.knowledge + ' 个考点';
      }
      return state.meta;
    } catch (e) {
      if (e.status === 401) {
        // 启动时静默尝试，口令保护下等用户主动操作再提示
        if (!silent) showAuthNeeded('输入访问口令后才能浏览题库。');
      } else {
        toast('题库信息加载失败：' + e.message, 'err');
      }
      return null;
    }
  }

  function renderSubjects() {
    const box = $('#bank-subjects');
    if (!box) return;
    box.replaceChildren();
    const items = [{key: '', label: '全部', count: state.meta ? state.meta.chunks : 0}]
      .concat((state.meta && state.meta.subjects) || []);
    items.forEach((s, idx) => {
      // 第一个是「全部」，后面的空 key 才是「未分类」
      const key = idx === 0 ? '' : (s.key === '' ? 'none' : (s.key || 'none'));
      const chip = el('button', 'chip' + (state.bank.subject === key ? ' active' : ''),
        s.label + (s.count != null ? ' ' + s.count : ''));
      chip.addEventListener('click', () => {
        state.bank.subject = key;
        renderSubjects();
        fetchBank(true);
      });
      box.appendChild(chip);
    });
  }

  function renderBankYears() {
    const box = $('#bank-years');
    if (!box) return;
    box.replaceChildren();
    const years = (state.meta && state.meta.years) || [];
    const items = [{key: '', label: '全部年份'}].concat(
      years.map(y => ({key: String(y), label: y + ' 年'})));
    items.forEach(s => {
      const chip = el('button', 'chip' + (state.bank.year === s.key ? ' active' : ''),
        s.label);
      chip.addEventListener('click', () => {
        if (state.bank.year === s.key) return;
        state.bank.year = s.key;
        renderBankYears();
        fetchBank(true);
      });
      box.appendChild(chip);
    });
    box.hidden = years.length < 2;
  }

  function fillYearSelect(sel, cur) {
    sel.replaceChildren();
    const optAll = el('option', null, '全部年份');
    optAll.value = '';
    sel.appendChild(optAll);
    ((state.meta && state.meta.years) || []).forEach(y => {
      const o = el('option', null, y + ' 年');
      o.value = String(y);
      sel.appendChild(o);
    });
    sel.value = cur;
    sel.hidden = ((state.meta && state.meta.years) || []).length < 2;
  }

  function fillSubjectSelect(sel, cur) {
    sel.replaceChildren();
    const optAll = el('option', null, '全部科目');
    optAll.value = '';
    sel.appendChild(optAll);
    ((state.meta && state.meta.subjects) || []).forEach(s => {
      const o = el('option', null, s.label + '（' + s.count + '）');
      o.value = s.key === '' ? 'none' : s.key;
      sel.appendChild(o);
    });
    sel.value = cur;
  }

  function renderPracticeSubjects() {
    const sel = $('#practice-subject');
    if (sel) fillSubjectSelect(sel, state.practice.subject);
    const year = $('#practice-year');
    if (year) fillYearSelect(year, state.practice.year);
  }

  function renderQuizSubjects() {
    const sel = $('#quiz-subject');
    if (sel) fillSubjectSelect(sel, state.practice.quizSubject);
    const year = $('#quiz-year');
    if (year) fillYearSelect(year, state.practice.quizYear);
  }

  function bankParams() {
    const b = state.bank;
    const params = new URLSearchParams();
    params.set('q', b.q);
    params.set('subject', b.subject);
    if (b.year) params.set('year', b.year);
    params.set('limit', '20');
    params.set('offset', String(b.offset));
    return params;
  }

  async function fetchBank(reset) {
    const b = state.bank;
    if (b.loading) return;
    if (!state.meta) {
      const meta = await ensureMeta();
      if (!meta) { renderBank(true); return; }
    }
    if (reset) { b.offset = 0; b.items = []; }
    b.loading = true;
    renderBank(false);
    try {
      const data = await api('/chunks?' + bankParams().toString());
      b.items = reset ? data.items : b.items.concat(data.items);
      b.total = data.total;
      b.offset = b.items.length;
    } catch (e) {
      if (e.status === 401) showAuthNeeded('访问口令无效，请重新输入。');
      else toast('题库加载失败：' + e.message, 'err');
    } finally {
      b.loading = false;
      renderBank(false);
    }
  }

  function renderBank(forceEmpty) {
    const list = $('#bank-list');
    if (!list) return;
    list.replaceChildren();
    const b = state.bank;
    if (b.loading && !b.items.length) {
      list.appendChild(el('div', 'empty-row', '正在加载题库…'));
    } else if (!b.items.length) {
      list.appendChild(el('div', 'empty-row', forceEmpty ? '输入访问口令后才能浏览题库。' : '没有匹配的题目。'));
    } else {
      b.items.forEach(q => list.appendChild(bankCard(q)));
    }
    $('#bank-meta').textContent = state.meta
      ? '共 ' + b.total + ' 题 · 已显示 ' + b.items.length + ' 题' +
        (b.year ? ' · ' + b.year + ' 年' : '') +
        (b.q ? ' · 搜索“' + b.q + '”' : '')
      : '';
    $('#bank-more').hidden = !b.items.length || b.items.length >= b.total;
    $('#bank-more').disabled = b.loading;
  }

  function bankCard(q) {
    const card = el('div', 'q-card');
    const meta = el('div', 'q-meta');
    meta.appendChild(el('span', 'q-id', q.id));
    meta.appendChild(el('span', 'q-tag', q.subject_label || subjectLabel(q.subject)));
    meta.appendChild(el('span', 'q-tag', typeLabel(q.type)));
    card.appendChild(meta);
    card.appendChild(el('div', 'q-stem', q.stem));
    card.addEventListener('click', () => openQuestion(q.id));
    return card;
  }

  /* ---------- knowledge ---------- */
  function renderKnowledgeSubjects() {
    const box = $('#kn-subjects');
    if (!box) return;
    box.replaceChildren();
    const k = state.knowledge;
    const subjects = k.subjects.length
      ? k.subjects
      : ((state.meta && state.meta.knowledge_subjects) || []);
    const total = subjects.reduce((n, s) => n + (s.count || 0), 0);
    const items = [{key: '', label: '全部', count: total}].concat(subjects);
    items.forEach(s => {
      const chip = el('button', 'chip' + (k.subject === s.key ? ' active' : ''),
        s.label + (s.count != null ? ' ' + s.count : ''));
      chip.addEventListener('click', () => {
        if (k.subject === s.key) return;
        k.subject = s.key;
        k.chapter = '';
        fetchKnowledge(true);
      });
      box.appendChild(chip);
    });
  }

  function renderKnowledgeChapters() {
    const box = $('#kn-chapters');
    const layout = $('#kn-layout');
    if (!box || !layout) return;
    const k = state.knowledge;
    const show = !!k.subject && k.chapters.length > 0;
    box.hidden = !show;
    layout.classList.toggle('no-nav', !show);
    box.replaceChildren();
    if (!show) return;

    const addChapter = (name, count) => {
      const btn = el('button', 'chapter-btn' + (k.chapter === name ? ' active' : ''));
      btn.appendChild(el('span', null, name || '全部章节'));
      if (count != null) btn.appendChild(el('span', 'chapter-count', String(count)));
      btn.addEventListener('click', () => {
        if (k.chapter === name) return;
        k.chapter = name;
        fetchKnowledge(true);
      });
      box.appendChild(btn);
    };
    addChapter('', k.total);
    k.chapters.forEach(c => addChapter(c.name, c.count));
  }

  async function fetchKnowledge(reset) {
    const k = state.knowledge;
    if (!state.meta) {
      const meta = await ensureMeta();
      if (!meta) { renderKnowledge(); return; }
    }
    if (reset) { k.offset = 0; k.items = []; k.chapters = []; }
    // 连续输入时只采用最后一次请求的结果，避免旧响应覆盖新搜索
    const seq = (k.seq || 0) + 1;
    k.seq = seq;
    k.loading = true;
    renderKnowledge();
    try {
      const params = new URLSearchParams();
      params.set('q', k.q);
      params.set('subject', k.subject);
      params.set('chapter', k.chapter);
      params.set('limit', '100');
      params.set('offset', String(k.offset));
      const data = await api('/knowledge?' + params.toString());
      if (seq !== state.knowledge.seq) return;
      k.items = reset ? (data.items || []) : k.items.concat(data.items || []);
      k.total = data.total;
      k.offset = k.items.length;
      k.subjects = data.subjects || [];
      k.chapters = data.chapters || [];
    } catch (e) {
      if (seq !== state.knowledge.seq) return;
      if (e.status === 401) showAuthNeeded('访问口令无效，请重新输入。');
      else toast('考点加载失败：' + e.message, 'err');
    } finally {
      if (seq === state.knowledge.seq) {
        k.loading = false;
        renderKnowledge();
      }
    }
  }

  function renderKnowledge() {
    const list = $('#kn-list');
    if (!list) return;
    const k = state.knowledge;
    list.replaceChildren();
    if (k.loading && !k.items.length) {
      list.appendChild(el('div', 'empty-row', '正在加载考点…'));
    } else if (!k.items.length) {
      list.appendChild(el('div', 'empty-row', '没有匹配的考点。'));
    } else {
      k.items.forEach(item => list.appendChild(knowledgeCard(item)));
    }
    $('#kn-meta').textContent = '共 ' + k.total + ' 个考点 · 已显示 ' + k.items.length +
      (k.q ? ' · 搜索“' + k.q + '”' : '');
    $('#kn-more').hidden = !k.items.length || k.items.length >= k.total;
    $('#kn-more').disabled = k.loading;
    renderKnowledgeSubjects();
    renderKnowledgeChapters();
  }

  function knowledgeCard(k) {
    const card = el('div', 'k-card');
    const meta = el('div', 'q-meta');
    meta.appendChild(el('span', 'q-id', k.id));
    meta.appendChild(el('span', 'q-tag', k.subject_label || subjectLabel(k.subject)));
    if (k.chapter) meta.appendChild(el('span', 'q-tag', k.chapter));
    meta.appendChild(el('span', 'q-tag k-tag', '考点'));
    card.appendChild(meta);
    card.appendChild(el('div', 'k-title', k.title));
    card.appendChild(el('div', 'k-summary', k.summary || ''));
    card.appendChild(el('div', 'k-foot', '关联真题 ' + (k.related_count || 0) + ' 道'));
    card.addEventListener('click', () => openKnowledge(k.id));
    return card;
  }

  async function openKnowledge(id, fromHash) {
    state.modalId = id;
    if (!fromHash) setHash('k', id);
    openModal('考点详情', el('div', 'empty-row', '正在加载考点…'));
    try {
      const k = await api('/knowledge/' + encodeURIComponent(id));
      $('#modal-body').replaceChildren(renderKnowledgeDetail(k));
    } catch (e) {
      const box = el('div', 'empty-row');
      box.textContent = e.status === 401 ? '需要访问口令。' : '考点加载失败：' + e.message;
      $('#modal-body').replaceChildren(box);
      if (e.status === 401) showAuthNeeded('访问口令无效，请重新输入。');
    }
  }

  function renderKnowledgeDetail(k) {
    const wrap = el('div');
    const meta = el('div', 'detail-meta');
    meta.appendChild(el('span', 'q-id', k.id));
    meta.appendChild(el('span', 'q-tag', k.subject_label || subjectLabel(k.subject)));
    if (k.chapter) meta.appendChild(el('span', 'q-tag', k.chapter));
    meta.appendChild(el('span', 'q-tag k-tag', '考点'));
    if (k.status) meta.appendChild(el('span', 'q-tag', k.status === 'draft' ? '草稿' : k.status));
    wrap.appendChild(meta);
    wrap.appendChild(el('div', 'k-title', k.title));
    wrap.appendChild(el('div', 'k-body', k.body || ''));

    if (k.formulas && k.formulas.length) {
      wrap.appendChild(el('div', 'section-title', '关键公式'));
      k.formulas.forEach(f => wrap.appendChild(el('div', 'k-formula', f)));
    }
    if (k.pitfalls) {
      wrap.appendChild(el('div', 'section-title', '易错点'));
      wrap.appendChild(el('div', 'k-pitfall', k.pitfalls));
    }

    wrap.appendChild(el('div', 'section-title', '关联真题（' + (k.related_questions || []).length + '）'));
    if (k.related_questions && k.related_questions.length) {
      k.related_questions.forEach(q => {
        const btn = el('button', 'related-q');
        btn.appendChild(el('b', null, q.id));
        btn.appendChild(document.createTextNode((q.stem || '').replace(/\s+/g, ' ').slice(0, 90)));
        btn.addEventListener('click', () => openQuestion(q.id));
        wrap.appendChild(btn);
      });
    } else {
      wrap.appendChild(el('div', 'practice-note', '暂无关联真题。'));
    }
    if (k.missing_questions && k.missing_questions.length) {
      wrap.appendChild(el('div', 'practice-note',
        '尚未收录的关联题目：' + k.missing_questions.join('、')));
    }

    const ref = k.source_ref || {};
    wrap.appendChild(el('div', 'source-line',
      '来源：' + (ref.file || '未知') + (ref.line ? ' · 第 ' + ref.line + ' 行' : '') +
      (k.provenance ? ' · ' + k.provenance : '')));

    const actions = el('div', 'btn-row');
    if (k.related_questions && k.related_questions.length) {
      const practice = el('button', 'primary', '练这个考点（' + k.related_questions.length + ' 题）');
      practice.addEventListener('click', () => startKnowledgePractice(k));
      actions.appendChild(practice);
    }
    const ask = el('button', 'ghost', '就这个考点提问');
    ask.addEventListener('click', () => {
      closeModal();
      go('chat');
      const composer = $('#composer');
      composer.value = '请讲解这个考点：' + (k.title || '');
      autoGrow();
      composer.focus();
    });
    actions.appendChild(ask);
    wrap.appendChild(actions);
    return wrap;
  }

  function startKnowledgePractice(k) {
    const p = state.practice;
    p.queue = (k.related_questions || []).slice();
    p.topic = '按考点练习：' + (k.title || '');
    p.subject = k.subject || '';
    p.current = null;
    p.detail = null;
    p.revealed = false;
    p.assessed = null;
    p.mode = 'drill';
    closeModal();
    go('practice');
  }

  /* ---------- practice ---------- */
  function practiceStat(label, value) {
    const box = el('div', 'stat');
    box.appendChild(document.createTextNode(label + ' '));
    box.appendChild(el('b', null, String(value)));
    return box;
  }

  function practiceHistoryRows() {
    const h = state.practice.history || {};
    return Object.keys(h)
      .map(id => Object.assign({id}, h[id]))
      .filter(r => r && r.id && r.stem);
  }

  function wrongRecords() {
    return practiceHistoryRows()
      .filter(r => r.result === 'unknown')
      .sort((a, b) => (b.last_at || 0) - (a.last_at || 0));
  }

  function formatWhen(ts) {
    if (!ts) return '刚刚';
    const d = new Date(ts);
    if (d.toDateString() === new Date().toDateString()) {
      return '今天 ' + String(d.getHours()).padStart(2, '0') + ':' +
        String(d.getMinutes()).padStart(2, '0');
    }
    return (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }

  // 题干里常有换行和代码块；收进列表时压成一行，避免行数截断后多出一个孤立的省略号。
  function stemPreview(stem) {
    return String(stem || '').replace(/\s+/g, ' ').trim();
  }

  function recordAssessment(q, kind) {
    if (!q || !q.id) return;
    const h = state.practice.history;
    const rec = h[q.id] || {attempts: 0, wrong: 0};
    rec.subject = q.subject || '';
    rec.subject_label = q.subject_label || subjectLabel(q.subject);
    rec.stem = stemPreview(q.stem).slice(0, 500);
    rec.result = kind;
    rec.attempts = (rec.attempts || 0) + 1;
    if (kind === 'unknown') rec.wrong = (rec.wrong || 0) + 1;
    rec.last_at = Date.now();
    h[q.id] = rec;
    saveHistory();
  }

  function masterySummary() {
    const rows = practiceHistoryRows();
    const by = {};
    rows.forEach(r => {
      const key = r.subject || '';
      by[key] = by[key] || {label: r.subject_label || subjectLabel(key), total: 0, known: 0};
      by[key].total += 1;
      if (r.result === 'known') by[key].known += 1;
    });
    const order = ['ds', 'co', 'os', 'cn', ''];
    const subjects = Object.keys(by).sort((a, b) => {
      const ia = order.indexOf(a), ib = order.indexOf(b);
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
    }).map(k => by[k]);
    return {
      total: rows.length,
      known: rows.filter(r => r.result === 'known').length,
      subjects
    };
  }

  function renderWrongCount() {
    const badge = $('#wrong-count');
    if (badge) badge.textContent = String(wrongRecords().length);
  }

  function renderPracticePage() {
    const p = state.practice;
    const mode = (p.mode === 'wrong' || p.mode === 'quiz') ? p.mode : 'drill';
    $('#practice-drill').hidden = mode !== 'drill';
    $('#practice-wrong').hidden = mode !== 'wrong';
    $('#practice-quiz').hidden = mode !== 'quiz';
    $$('#practice-tabs .ptab').forEach(b => {
      b.classList.toggle('active', b.dataset.mode === mode);
    });
    renderWrongCount();
    if (mode === 'wrong') renderWrongBook();
    else if (mode === 'quiz') {
      renderQuizSubjects();
      renderQuiz();
    } else {
      renderPractice();
    }
  }

  function renderWrongBook() {
    const m = masterySummary();
    const rows = practiceHistoryRows();
    const panel = $('#mastery-panel');
    panel.replaceChildren();

    const head = el('div', 'mastery-head');
    if (!m.total) {
      head.appendChild(el('b', null, '还没有练习记录'));
      head.appendChild(el('span', null, '先做几道题，再回来看掌握度'));
      panel.appendChild(head);
    } else {
      const pct = Math.round(m.known / m.total * 100);
      head.appendChild(el('b', null, '掌握度 ' + pct + '%'));
      head.appendChild(el('span', null,
        '按最近一次自评 · 仅本机 · 已掌握 ' + m.known + ' / ' + m.total + ' 题'));
      panel.appendChild(head);
      m.subjects.forEach(s => {
        const pctSub = s.total ? Math.round(s.known / s.total * 100) : 0;
        const row = el('div', 'mastery-row');
        row.appendChild(el('div', 'mastery-label', s.label));
        const track = el('div', 'mastery-track');
        const fill = el('div', 'mastery-fill');
        fill.style.width = pctSub + '%';
        track.appendChild(fill);
        track.setAttribute('role', 'progressbar');
        track.setAttribute('aria-valuemin', '0');
        track.setAttribute('aria-valuemax', String(s.total));
        track.setAttribute('aria-valuenow', String(s.known));
        track.setAttribute('aria-label', s.label + '掌握度 ' + pctSub + '%');
        row.appendChild(track);
        row.appendChild(el('div', 'mastery-value', s.known + '/' + s.total));
        row.setAttribute('title', s.label + '：' + pctSub + '%');
        panel.appendChild(row);
      });
    }

    const wrong = wrongRecords();
    $('#wrong-stats').replaceChildren(
      practiceStat('错题', wrong.length),
      practiceStat('已掌握', m.known),
      practiceStat('练过', m.total)
    );
    $('#wrong-redo').disabled = !wrong.length;

    const list = $('#wrong-list');
    list.replaceChildren();
    if (!wrong.length) {
      list.appendChild(el('div', 'wrong-empty', rows.length
        ? '错题清空了。继续练习，点「还不太会」的题会自动进这里。'
        : '还没有错题。练习时点「还不太会」，题目会进这里。'));
      return;
    }
    wrong.forEach(r => {
      const row = el('div', 'wrong-row');
      const main = el('div', 'wrong-main');
      const meta = el('div', 'wrong-meta');
      meta.appendChild(el('span', 'q-id', r.id));
      meta.appendChild(el('span', 'q-tag', r.subject_label || subjectLabel(r.subject)));
      meta.appendChild(el('span', null,
        '错了 ' + (r.wrong || 1) + ' 次 · ' + formatWhen(r.last_at)));
      main.appendChild(meta);
      main.appendChild(el('div', 'wrong-stem', stemPreview(r.stem)));
      main.addEventListener('click', () => openQuestion(r.id));
      row.appendChild(main);

      const actions = el('div', 'wrong-actions');
      const again = el('button', 'ghost', '重练');
      again.addEventListener('click', () => startWrongPractice([r.id]));
      const looked = el('button', 'ghost', '看原题');
      looked.addEventListener('click', () => openQuestion(r.id));
      actions.appendChild(again);
      actions.appendChild(looked);
      row.appendChild(actions);
      list.appendChild(row);
    });
  }

  async function ensureQuestionMap() {
    const p = state.practice;
    if (p.map) return p.map;
    const map = {};
    let offset = 0;
    for (let page = 0; page < 30; page += 1) {
      const data = await api('/chunks?limit=100&offset=' + offset);
      const items = data.items || [];
      items.forEach(q => { map[q.id] = q; });
      offset += items.length;
      if (!items.length || offset >= (data.total || 0)) break;
    }
    p.map = map;
    return p.map;
  }

  function bumpStats(kind) {
    state.stats.seen = (state.stats.seen || 0) + 1;
    if (kind === 'known') state.stats.known = (state.stats.known || 0) + 1;
    else state.stats.unknown = (state.stats.unknown || 0) + 1;
    saveStats();
  }

  function shuffleCopy(list) {
    const a = list.slice();
    for (let i = a.length - 1; i > 0; i -= 1) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  async function startQuiz() {
    const p = state.practice;
    const subject = p.quizSubject || '';
    const year = p.quizYear || '';
    p.quiz = {loading: true, subject, year};
    renderQuiz();
    try {
      const map = await ensureQuestionMap();
      const want = subject === 'none' ? '' : subject;
      let pool = Object.values(map).filter(q =>
        q && q.type === 'single' && q.has_options);
      if (want) pool = pool.filter(q => (q.subject || '') === want);
      if (year) pool = pool.filter(q => String(q.year || '') === year);
      if (!pool.length) {
        p.quiz = {error: '这个筛选条件下还没有可判分的单选题', subject, year};
        renderQuiz();
        return;
      }
      const picked = shuffleCopy(pool).slice(0, 10);
      const questions = await Promise.all(
        picked.map(q => api('/chunks/' + encodeURIComponent(q.id))));
      p.quiz = {
        subject, questions, index: 0, picks: {}, submitted: {},
        correct: 0, finished: false
      };
      renderQuiz();
    } catch (e) {
      p.quiz = {error: '组卷失败：' + e.message, subject};
      renderQuiz();
      if (e.status === 401) showAuthNeeded('访问口令无效，请重新输入。');
    }
  }

  function renderQuizIntro(qz) {
    const card = el('div', 'practice-card');
    card.appendChild(el('h2', null, '10 题小测'));
    card.appendChild(el('div', 'practice-note',
      '每组最多 10 道选择题，提交后立即判分；做错的题会自动进错题本。'));
    card.appendChild(el('div', 'practice-note',
      '键盘操作：A–D 选择答案，Enter 提交或进入下一题。'));
    if (qz && qz.error) card.appendChild(el('div', 'warn-box', qz.error));
    const row = el('div', 'btn-row');
    const start = el('button', 'primary', '开始小测');
    start.addEventListener('click', startQuiz);
    row.appendChild(start);
    card.appendChild(row);
    return card;
  }

  function renderQuiz() {
    const qz = state.practice.quiz;
    const stats = $('#quiz-stats');
    const box = $('#quiz-card');
    box.replaceChildren();

    if (!qz) {
      stats.replaceChildren(practiceStat('题量', '最多 10 题'),
                            practiceStat('判分', '自动'));
      box.appendChild(renderQuizIntro(null));
      return;
    }
    if (qz.loading) {
      stats.replaceChildren(practiceStat('状态', '组卷中…'));
      box.appendChild(el('div', 'practice-empty', '正在从题库抽题…'));
      return;
    }
    if (qz.error) {
      stats.replaceChildren(practiceStat('题量', '最多 10 题'));
      box.appendChild(renderQuizIntro(qz));
      return;
    }
    if (qz.finished) {
      renderQuizResult(qz);
      return;
    }

    const item = qz.questions[qz.index];
    const correct = String(item.answer || '').trim().toUpperCase();
    const submitted = !!qz.submitted[item.id];
    const pick = qz.picks[item.id] || '';
    stats.replaceChildren(
      practiceStat('进度', (qz.index + 1) + ' / ' + qz.questions.length),
      practiceStat('答对', qz.correct)
    );

    const card = el('div', 'practice-card');
    const meta = el('div', 'q-meta');
    meta.appendChild(el('span', 'q-id', item.id));
    meta.appendChild(el('span', 'q-tag',
      item.subject_label || subjectLabel(item.subject)));
    meta.appendChild(el('span', 'q-tag', '第 ' + (qz.index + 1) + ' 题'));
    card.appendChild(meta);
    card.appendChild(el('h2', null, item.stem));

    const opts = item.options || {};
    Object.keys(opts).sort().forEach(k => {
      const row = el('button', 'opt quiz-opt');
      row.type = 'button';
      if (pick === k) row.classList.add('selected');
      if (submitted && correct === k) row.classList.add('correct');
      if (submitted && pick === k && pick !== correct) row.classList.add('wrong-opt');
      row.disabled = submitted;
      row.appendChild(el('span', 'opt-letter', k + '.'));
      row.appendChild(el('span', null, opts[k]));
      row.addEventListener('click', () => {
        qz.picks[item.id] = k;
        renderQuiz();
      });
      card.appendChild(row);
    });

    const actions = el('div', 'btn-row');
    if (!submitted) {
      const submit = el('button', 'primary', '提交答案');
      submit.disabled = !pick;
      submit.addEventListener('click', submitQuizAnswer);
      actions.appendChild(submit);
    } else {
      const next = el('button', 'primary',
        qz.index + 1 >= qz.questions.length ? '查看结果' : '下一题');
      next.addEventListener('click', nextQuizQuestion);
      actions.appendChild(next);
      const verdict = el('span', 'practice-note',
        pick === correct ? '答对了' : '答错了，正确答案是 ' + correct);
      verdict.style.margin = '8px 0 0';
      actions.appendChild(verdict);
    }
    card.appendChild(actions);

    if (submitted) {
      const answerBox = el('div', 'answer-box');
      answerBox.appendChild(el('div', 'section-title', '参考答案'));
      answerBox.appendChild(el('div', 'detail-answer', item.answer || '见解析'));
      if (item.analysis) {
        answerBox.appendChild(el('div', 'section-title', '解析'));
        answerBox.appendChild(el('div', 'analysis', item.analysis));
      }
      card.appendChild(answerBox);
    }

    box.appendChild(card);
  }

  function submitQuizAnswer() {
    const qz = state.practice.quiz;
    if (!qz || qz.finished) return;
    const item = qz.questions[qz.index];
    const pick = qz.picks[item.id];
    if (!pick || qz.submitted[item.id]) return;
    const correct = String(item.answer || '').trim().toUpperCase();
    const ok = pick === correct;
    qz.submitted[item.id] = true;
    if (ok) qz.correct += 1;
    bumpStats(ok ? 'known' : 'unknown');
    recordAssessment(item, ok ? 'known' : 'unknown');
    renderQuiz();
    renderWrongCount();
  }

  function nextQuizQuestion() {
    const qz = state.practice.quiz;
    if (!qz || qz.finished) return;
    if (qz.index + 1 >= qz.questions.length) {
      qz.finished = true;
    } else {
      qz.index += 1;
    }
    renderQuiz();
  }

  function renderQuizResult(qz) {
    const total = qz.questions.length;
    const pct = Math.round(qz.correct / total * 100);
    $('#quiz-stats').replaceChildren(
      practiceStat('得分', pct + '%'),
      practiceStat('答对', qz.correct + ' / ' + total)
    );

    const card = el('div', 'practice-card');
    card.appendChild(el('h2', null, '本组完成'));
    card.appendChild(el('div', 'quiz-score', pct + '%'));
    card.appendChild(el('div', 'quiz-sub',
      '答对 ' + qz.correct + ' / ' + total + ' 题' +
      (qz.correct === total ? '，全对。' : '，错题已加入错题本。')));

    const wrong = qz.questions.filter(q =>
      qz.picks[q.id] !== String(q.answer || '').trim().toUpperCase());
    if (wrong.length) {
      const list = el('div', 'wrong-list');
      list.style.marginTop = '14px';
      wrong.forEach(q => {
        const row = el('div', 'wrong-row');
        const main = el('div', 'wrong-main');
        const meta = el('div', 'wrong-meta');
        meta.appendChild(el('span', 'q-id', q.id));
        meta.appendChild(el('span', 'q-tag',
          q.subject_label || subjectLabel(q.subject)));
        meta.appendChild(el('span', null,
          '你的答案 ' + (qz.picks[q.id] || '-') + ' · 正确 ' + (q.answer || '-')));
        main.appendChild(meta);
        main.appendChild(el('div', 'wrong-stem', stemPreview(q.stem)));
        main.addEventListener('click', () => openQuestion(q.id));
        row.appendChild(main);
        list.appendChild(row);
      });
      card.appendChild(list);
    }

    const actions = el('div', 'btn-row');
    const again = el('button', 'primary', '再来一组');
    again.addEventListener('click', startQuiz);
    const wrongBook = el('button', 'ghost', '查看错题本');
    wrongBook.addEventListener('click', () => {
      state.practice.mode = 'wrong';
      renderPracticePage();
    });
    const drill = el('button', 'ghost', '回到随机练习');
    drill.addEventListener('click', () => {
      state.practice.mode = 'drill';
      renderPracticePage();
    });
    actions.appendChild(again);
    actions.appendChild(wrongBook);
    actions.appendChild(drill);
    card.appendChild(actions);
    $('#quiz-card').replaceChildren(card);
  }

  async function startWrongPractice(ids) {
    try {
      const map = await ensureQuestionMap();
      const queue = (ids || []).map(id => map[id]).filter(Boolean);
      if (!queue.length) {
        toast('这些题已不在题库里', 'err');
        return;
      }
      const p = state.practice;
      p.queue = queue;
      p.topic = ids.length > 1 ? '错题本 · 重练全部' : '错题重练';
      p.current = null;
      p.detail = null;
      p.revealed = false;
      p.assessed = null;
      p.mode = 'drill';
      renderPracticePage();
      loadPractice();
    } catch (e) {
      if (e.status === 401) showAuthNeeded('访问口令无效，请重新输入。');
      else toast('错题加载失败：' + e.message, 'err');
    }
  }

  function renderPractice() {
    const p = state.practice;
    const banner = $('#practice-topic');
    if (banner) {
      banner.hidden = !p.topic;
      if (p.topic) {
        const left = p.queue ? p.queue.length : 0;
        $('#practice-topic-text').textContent = p.topic +
          (left ? ' · 队列剩余 ' + left + ' 题' : '');
      }
    }

    const stats = $('#practice-stats');
    stats.replaceChildren(
      practiceStat('已练', state.stats.seen || 0),
      practiceStat('会了', state.stats.known || 0),
      practiceStat('还不会', state.stats.unknown || 0)
    );

    const box = $('#practice-card');
    box.replaceChildren();
    if (!p.current) {
      box.appendChild(el('div', 'practice-empty', '当前科目还没有题目。'));
      return;
    }

    const d = (p.revealed && p.detail) ? p.detail : p.current;
    const card = el('div', 'practice-card');
    const meta = el('div', 'q-meta');
    meta.appendChild(el('span', 'q-id', d.id));
    meta.appendChild(el('span', 'q-tag', d.subject_label || subjectLabel(d.subject)));
    meta.appendChild(el('span', 'q-tag', typeLabel(d.type)));
    card.appendChild(meta);
    card.appendChild(el('h2', null, d.stem));

    const opts = d.options || {};
    const keys = Object.keys(opts).sort();
    if (keys.length) {
      keys.forEach(k => {
        const row = el('div', 'opt');
        if (p.revealed && String(d.answer || '').trim().toUpperCase() === k.toUpperCase()) {
          row.classList.add('correct');
        }
        row.appendChild(el('span', 'opt-letter', k + '.'));
        row.appendChild(el('span', null, opts[k]));
        card.appendChild(row);
      });
    } else {
      card.appendChild(el('div', 'practice-note', '综合题：先写出自己的思路，再展开答案。'));
    }

    const actions = el('div', 'btn-row');
    if (!p.revealed) {
      const reveal = el('button', 'primary', '查看答案');
      reveal.addEventListener('click', revealPractice);
      actions.appendChild(reveal);
      const hint = el('span', 'practice-note', '先自己作答，再看解析，效果更好。');
      hint.style.margin = '8px 0 0';
      card.appendChild(actions);
      card.appendChild(hint);
    } else {
      const detail = p.detail || {};
      const answerBox = el('div', 'answer-box');
      answerBox.appendChild(el('div', 'section-title', '参考答案'));
      answerBox.appendChild(el('div', 'detail-answer', detail.answer || '见解析'));
      if (detail.analysis) {
        answerBox.appendChild(el('div', 'section-title', '解析'));
        answerBox.appendChild(el('div', 'analysis', detail.analysis));
      }
      if (detail.analysis_origin === 'ai') {
        answerBox.appendChild(el('div', 'practice-note', '解析由 AI 生成，待人工校对。'));
      }
      card.appendChild(answerBox);

      if (detail.needs_figure) {
        card.appendChild(el('div', 'warn-box', '本题涉及图形，题库暂未收录图片，具体数值请对照原卷。'));
      }

      if (!p.assessed) {
        const ok = el('button', 'primary ok-btn', '这题我会了');
        ok.addEventListener('click', () => assessPractice('known'));
        const no = el('button', 'primary no-btn', '还不太会');
        no.addEventListener('click', () => assessPractice('unknown'));
        actions.appendChild(ok);
        actions.appendChild(no);
      } else {
        actions.appendChild(el('span', 'practice-note',
          p.assessed === 'known' ? '已标记：会了' : '已标记：还不会'));
      }
      const next = el('button', p.assessed ? 'primary' : 'ghost', '下一题');
      next.addEventListener('click', () => loadPractice());
      actions.appendChild(next);
      card.appendChild(actions);
    }

    box.appendChild(card);
  }

  async function loadPractice() {
    const p = state.practice;
    // 从考点进来的题队列优先；队列空了再回到当前科目的随机练习
    if (p.queue && p.queue.length) {
      p.current = p.queue.shift();
      p.detail = null;
      p.revealed = false;
      p.assessed = null;
      renderPractice();
      return;
    }
    if (p.queue) {
      p.queue = null;
      p.topic = '';
    }

    const meta = await ensureMeta();
    if (!meta) return;
    const params = new URLSearchParams();
    params.set('subject', p.subject);
    if (p.year) params.set('year', p.year);
    params.set('limit', '100');
    try {
      const data = await api('/chunks?' + params.toString());
      p.list = data.items || [];
      if (!p.list.length) {
        p.current = null; p.detail = null; p.revealed = false; p.assessed = null;
        renderPractice();
        return;
      }
      const pool = p.list.filter(x => !p.current || x.id !== p.current.id);
      const source = pool.length ? pool : p.list;
      const pick = source[Math.floor(Math.random() * source.length)];
      p.current = pick;
      p.detail = null;
      p.revealed = false;
      p.assessed = null;
      renderPractice();
    } catch (e) {
      if (e.status === 401) showAuthNeeded('访问口令无效，请重新输入。');
      else toast('练习加载失败：' + e.message, 'err');
    }
  }

  async function revealPractice() {
    const p = state.practice;
    if (!p.current) return;
    try {
      p.detail = await api('/chunks/' + encodeURIComponent(p.current.id));
      p.revealed = true;
      renderPractice();
    } catch (e) {
      if (e.status === 401) showAuthNeeded('访问口令无效，请重新输入。');
      else toast('答案加载失败：' + e.message, 'err');
    }
  }

  function assessPractice(kind) {
    const p = state.practice;
    if (p.assessed) return;
    p.assessed = kind;
    bumpStats(kind);
    recordAssessment(p.current, kind);
    renderPractice();
    renderWrongCount();
  }

  /* ---------- question detail ---------- */
  async function openQuestion(id, fromHash) {
    state.modalId = id;
    if (!fromHash) setHash('q', id);
    openModal('原题详情', el('div', 'empty-row', '正在加载原题…'));
    try {
      const q = await api('/chunks/' + encodeURIComponent(id));
      $('#modal-body').replaceChildren(renderDetail(q));
    } catch (e) {
      const box = el('div', 'empty-row');
      box.textContent = e.status === 401 ? '需要访问口令。' : '原题加载失败：' + e.message;
      $('#modal-body').replaceChildren(box);
      if (e.status === 401) showAuthNeeded('访问口令无效，请重新输入。');
    }
  }

  function renderDetail(q) {
    const wrap = el('div');
    const meta = el('div', 'detail-meta');
    meta.appendChild(el('span', 'q-id', q.id));
    meta.appendChild(el('span', 'q-tag', q.subject_label || subjectLabel(q.subject)));
    meta.appendChild(el('span', 'q-tag', typeLabel(q.type)));
    if (q.score != null) meta.appendChild(el('span', 'q-tag', q.score + ' 分'));
    if (q.year) meta.appendChild(el('span', 'q-tag', q.year + ' 年'));
    wrap.appendChild(meta);
    wrap.appendChild(el('div', 'detail-stem', q.stem));

    const opts = q.options || {};
    Object.keys(opts).sort().forEach(k => {
      const row = el('div', 'detail-opt');
      if (String(q.answer || '').trim().toUpperCase() === k.toUpperCase()) {
        row.classList.add('correct');
      }
      row.textContent = k + '. ' + opts[k];
      wrap.appendChild(row);
    });

    const answer = el('div', 'answer-box');
    answer.appendChild(el('div', 'section-title', '参考答案'));
    answer.appendChild(el('div', 'detail-answer', q.answer || '见解析'));
    if (q.analysis) {
      answer.appendChild(el('div', 'section-title', '解析'));
      answer.appendChild(el('div', 'analysis', q.analysis));
    } else {
      answer.appendChild(el('div', 'practice-note', '本题暂无解析。'));
    }
    if (q.analysis_origin === 'ai') {
      answer.appendChild(el('div', 'practice-note', '解析由 AI 生成，待人工校对。'));
    }
    wrap.appendChild(answer);

    if (q.needs_figure) {
      wrap.appendChild(el('div', 'warn-box', '题干涉及图形，题库暂未收录图片，请对照原卷。'));
    }

    if (q.related_knowledge && q.related_knowledge.length) {
      wrap.appendChild(el('div', 'section-title', '关联考点'));
      const chips = el('div', 'related-chips');
      q.related_knowledge.forEach(k => {
        const chip = el('button', 'chip', k.title + ' · ' + (k.chapter || '考点'));
        chip.addEventListener('click', () => openKnowledge(k.id));
        chips.appendChild(chip);
      });
      wrap.appendChild(chips);
    }

    const ref = q.source_ref || {};
    if (ref.file || ref.line) {
      wrap.appendChild(el('div', 'source-line',
        '原文：' + (ref.file || '未知') + (ref.line ? ' · 第 ' + ref.line + ' 行' : '')));
    }

    const actions = el('div', 'btn-row');
    const ask = el('button', 'primary', '就这道题提问');
    ask.addEventListener('click', () => {
      closeModal();
      go('chat');
      const composer = $('#composer');
      composer.value = '请讲解这道题：' + (q.stem || q.id).slice(0, 80);
      autoGrow();
      composer.focus();
    });
    actions.appendChild(ask);
    wrap.appendChild(actions);
    return wrap;
  }

  /* ---------- modal / settings ---------- */
  function openModal(title, bodyNode) {
    $('#modal-title').textContent = title;
    $('#modal-body').replaceChildren(bodyNode);
    $('#modal').hidden = false;
    document.body.style.overflow = 'hidden';
  }

  function closeModal(silent) {
    const routeId = state.modalId;
    state.modalId = '';
    $('#modal').hidden = true;
    document.body.style.overflow = '';
    // 关闭详情时把地址栏退回当前页；用 replace 避免多出一条历史记录
    if (routeId && !silent) history.replaceState(null, '', '#/' + state.page);
  }

  function openSettings(message) {
    const wrap = el('div');
    if (message) wrap.appendChild(el('div', 'warn-box', message));

    const row = el('div', 'settings-row');
    const label = el('label', null, '访问口令');
    const input = el('input');
    input.type = 'password';
    input.autocomplete = 'current-password';
    input.placeholder = '输入访问口令';
    input.value = state.token || '';
    row.appendChild(label);
    row.appendChild(input);
    wrap.appendChild(row);

    const actions = el('div', 'btn-row');
    const save = el('button', 'primary', '保存并验证');
    const test = el('button', 'ghost', '测试连接');
    actions.appendChild(save);
    actions.appendChild(test);
    wrap.appendChild(actions);

    const status = el('div', 'settings-status');
    wrap.appendChild(status);
    wrap.appendChild(el('div', 'settings-note',
      '口令只保存在本机浏览器，通过 X-Access-Token 请求头发送，不会写进日志。'));
    if (state.health) {
      wrap.appendChild(el('div', 'settings-note',
        '服务状态：' + (state.health.chunks || 0) + ' 题 · ' +
        (state.health.knowledge || 0) + ' 个考点 · ' +
        (state.health.mode || '—') + ' · ' + (state.health.provider || '—')));
    }

    async function verify(token, saveIt) {
      status.className = 'settings-status';
      status.textContent = '正在验证…';
      save.disabled = true;
      test.disabled = true;
      try {
        const m = await api('/meta', {}, token);
        state.meta = m;
        if (saveIt) {
          state.token = token;
          if (token) localStorage.setItem(TOKEN_KEY, token);
          else localStorage.removeItem(TOKEN_KEY);
          renderToken();
        }
        renderSubjects();
        renderPracticeSubjects();
        status.textContent = '连接正常：' + m.chunks + ' 题 · ' +
          (m.knowledge || 0) + ' 个考点 · ' + m.mode;
        if (saveIt) {
          setTimeout(() => { closeModal(); loadHealth(); }, 500);
        }
      } catch (e) {
        if (saveIt) {
          if (e.status === 401) {
            state.token = '';
            localStorage.removeItem(TOKEN_KEY);
          } else {
            state.token = token;
            if (token) localStorage.setItem(TOKEN_KEY, token);
            else localStorage.removeItem(TOKEN_KEY);
          }
          renderToken();
        }
        status.className = 'settings-status err';
        status.textContent = e.status === 401 ? '口令无效。' : '连接失败：' + e.message;
      } finally {
        save.disabled = false;
        test.disabled = false;
      }
    }

    save.addEventListener('click', () => verify(input.value.trim(), true));
    test.addEventListener('click', () => verify(input.value.trim(), false));
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); verify(input.value.trim(), true); }
    });

    openModal('设置', wrap);
    setTimeout(() => input.focus(), 60);
  }

  /* ---------- routing / events ---------- */
  // 页面和详情都进地址栏：刷新、分享链接、浏览器后退都能回到原处。
  function setHash(page, id) {
    const target = '#/' + page + (id ? '/' + encodeURIComponent(id) : '');
    if (location.hash === target) return;
    history.pushState(null, '', target);
  }

  function parseHash() {
    const raw = (location.hash || '').replace(/^#\/?/, '');
    const parts = raw.split('/').filter(Boolean).map(p => {
      try { return decodeURIComponent(p); } catch (e) { return p; }
    });
    const head = parts[0] || 'chat';
    if (head === 'q') return {page: state.page, qid: parts[1] || ''};
    if (head === 'k') return {page: 'knowledge', kid: parts[1] || ''};
    return {
      page: Object.prototype.hasOwnProperty.call(PAGE_META, head) ? head : 'chat'
    };
  }

  function pageSub(page) {
    if (page === 'bank' && state.meta) {
      return '按年份和科目浏览 ' + state.meta.chunks + ' 道真题';
    }
    return (PAGE_META[page] || PAGE_META.chat).sub;
  }

  function applyHash() {
    const r = parseHash();
    if (r.page !== state.page) renderPage(r.page);
    if (r.qid && r.qid !== state.modalId) openQuestion(r.qid, true);
    else if (r.kid && r.kid !== state.modalId) openKnowledge(r.kid, true);
    else if (!r.qid && !r.kid && state.modalId) closeModal(true);
  }

  function go(page) {
    renderPage(page);
    setHash(page);
  }

  function renderPage(page) {
    state.page = page;
    $$('#nav button').forEach(b => b.classList.toggle('active', b.dataset.page === page));
    $$('.page').forEach(p => p.classList.toggle('active', p.id === 'page-' + page));
    const meta = PAGE_META[page] || PAGE_META.chat;
    $('#page-title').textContent = meta.title;
    $('#page-sub').textContent = pageSub(page);
    closeSidebar();
    if (page === 'chat') {
      renderMessages();
      setTimeout(() => { const c = $('#composer'); if (c) c.focus(); }, 60);
    } else if (page === 'bank') {
      ensureMeta().then(m => {
        if (m) {
          $('#page-sub').textContent = pageSub('bank');
          renderSubjects();
          renderBankYears();
          if (!state.bank.items.length) fetchBank(true);
          else renderBank(false);
        } else {
          renderBank(true);
        }
      });
    } else if (page === 'knowledge') {
      ensureMeta().then(m => {
        if (!m) { renderKnowledge(); return; }
        if (!state.knowledge.items.length) fetchKnowledge(true);
        else renderKnowledge();
      });
    } else if (page === 'practice') {
      ensureMeta().then(m => {
        if (m) {
          renderPracticeSubjects();
          renderPracticePage();
          if (state.practice.mode === 'drill' && !state.practice.current) loadPractice();
        } else {
          renderPracticePage();
        }
      });
    }
  }

  function bind() {
    $$('#nav button').forEach(b => {
      b.addEventListener('click', () => go(b.dataset.page));
    });
    $('#new-chat').addEventListener('click', newChat);
    $('#send').addEventListener('click', send);
    $('#menu-btn').addEventListener('click', openSidebar);
    $('#scrim').addEventListener('click', closeSidebar);
    $('#settings-btn').addEventListener('click', () => openSettings(''));
    $('#auth-open').addEventListener('click', () => openSettings('这个站点需要访问口令。'));
    $('#modal-close').addEventListener('click', () => closeModal());
    $('#modal').addEventListener('click', e => {
      if (e.target.id === 'modal') closeModal();
    });

    const composer = $('#composer');
    composer.addEventListener('input', autoGrow);
    composer.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        send();
      }
    });

    let bankTimer = null;
    $('#bank-q').addEventListener('input', e => {
      clearTimeout(bankTimer);
      bankTimer = setTimeout(() => {
        state.bank.q = e.target.value.trim();
        fetchBank(true);
      }, 320);
    });
    $('#bank-more').addEventListener('click', () => fetchBank(false));

    let knTimer = null;
    $('#kn-q').addEventListener('input', e => {
      clearTimeout(knTimer);
      knTimer = setTimeout(() => {
        state.knowledge.q = e.target.value.trim();
        fetchKnowledge(true);
      }, 320);
    });
    $('#kn-more').addEventListener('click', () => fetchKnowledge(false));

    window.addEventListener('popstate', applyHash);
    window.addEventListener('hashchange', applyHash);

    $('#practice-subject').addEventListener('change', e => {
      state.practice.subject = e.target.value;
      state.practice.current = null;
      state.practice.queue = null;
      state.practice.topic = '';
      loadPractice();
    });
    $('#practice-year').addEventListener('change', e => {
      state.practice.year = e.target.value;
      state.practice.current = null;
      state.practice.queue = null;
      state.practice.topic = '';
      loadPractice();
    });
    $('#practice-topic-exit').addEventListener('click', () => {
      state.practice.queue = null;
      state.practice.topic = '';
      state.practice.current = null;
      loadPractice();
    });
    $('#quiz-subject').addEventListener('change', e => {
      state.practice.quizSubject = e.target.value;
      state.practice.quiz = null;
      renderQuiz();
    });
    $('#quiz-year').addEventListener('change', e => {
      state.practice.quizYear = e.target.value;
      state.practice.quiz = null;
      renderQuiz();
    });
    $$('#practice-tabs .ptab').forEach(b => {
      b.addEventListener('click', () => {
        state.practice.mode = b.dataset.mode;
        renderPracticePage();
      });
    });
    $('#wrong-redo').addEventListener('click', () => {
      const ids = wrongRecords().map(r => r.id);
      if (ids.length) startWrongPractice(ids);
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        if (!$('#modal').hidden) closeModal();
        else closeSidebar();
        return;
      }
      // 小测键盘操作：A–D 选项，Enter 提交/下一题
      if (state.page !== 'practice' || state.practice.mode !== 'quiz') return;
      if (!$('#modal').hidden || e.isComposing || e.ctrlKey || e.metaKey || e.altKey) return;
      const tag = (e.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
      const qz = state.practice.quiz;
      if (!qz || qz.loading || qz.error || qz.finished) return;
      const item = qz.questions[qz.index];
      const key = e.key.toLowerCase();
      if (key === 'enter') {
        if (qz.submitted[item.id]) nextQuizQuestion();
        else if (qz.picks[item.id]) submitQuizAnswer();
        e.preventDefault();
      } else if ('abcd'.indexOf(key) >= 0 && !qz.submitted[item.id]) {
        qz.picks[item.id] = key.toUpperCase();
        renderQuiz();
        e.preventDefault();
      }
    });
  }

  function init() {
    bind();
    renderToken();
    applyHash();
    renderConvList();
    renderMessages();
    autoGrow();
    loadHealth();
    ensureMeta(true);
  }

  init();
})();
</script>
</body>
</html>
