<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <title>408 真题知识库</title>
  <style>
    :root {
      --ink: #1e293b; --muted: #64748b; --line: #e2e8f0; --bg: #f5f7fb;
      --card: #ffffff; --brand: #2563eb; --brand-dark: #1d4ed8;
      --ok: #047857; --warn: #b45309; --danger: #b91c1c;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font: 15px/1.65 -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    [hidden] { display: none !important; }

    .app { display: grid; grid-template-columns: 268px 1fr; height: 100dvh; overflow: hidden; }

    /* ---------- sidebar ---------- */
    .sidebar {
      display: flex; flex-direction: column; gap: 14px; min-height: 0;
      padding: 18px 14px 14px; color: #cbd5e1; overflow: hidden;
      background: linear-gradient(180deg, #0b1220 0%, #101b30 100%);
    }
    .brand { display: flex; align-items: center; gap: 10px; padding: 2px 6px 8px; }
    .logo {
      width: 38px; height: 38px; flex: none; border-radius: 11px; color: #fff;
      background: linear-gradient(135deg, #60a5fa, #1d4ed8);
      display: grid; place-items: center; font-size: 12px; font-weight: 800; letter-spacing: .4px;
    }
    .brand h1 { margin: 0; font-size: 15px; color: #f8fafc; letter-spacing: .2px; }
    .brand p { margin: 1px 0 0; font-size: 11px; color: #718096; }
    .new-chat {
      width: 100%; border: 0; border-radius: 10px; padding: 10px 12px;
      background: #1d4ed8; color: #fff; font-size: 14px; font-weight: 600;
      transition: background .15s;
    }
    .new-chat:hover { background: #2563eb; }
    .nav { display: flex; flex-direction: column; gap: 2px; }
    .nav button {
      display: flex; align-items: center; gap: 10px; width: 100%;
      padding: 9px 10px; border: 0; border-radius: 9px; background: transparent;
      color: #94a3b8; font-size: 14px; text-align: left; transition: background .15s, color .15s;
    }
    .nav button:hover { background: #151f33; color: #e2e8f0; }
    .nav button.active { background: #1e293b; color: #fff; }
    .nav-ico { width: 18px; text-align: center; color: #60a5fa; font-size: 13px; }
    .side-section { flex: 1; min-height: 0; display: flex; flex-direction: column; margin-top: 2px; }
    .side-title {
      padding: 0 8px 6px; color: #64748b; font-size: 10px;
      letter-spacing: .1em; text-transform: uppercase;
    }
    .conv-list { overflow-y: auto; display: flex; flex-direction: column; gap: 2px; padding-right: 2px; }
    .conv-list::-webkit-scrollbar { width: 5px; }
    .conv-list::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
    .conv-item {
      display: flex; align-items: center; gap: 4px; padding: 8px 8px 8px 10px;
      border-radius: 8px; color: #94a3b8; font-size: 13px; cursor: pointer;
      transition: background .12s, color .12s;
    }
    .conv-item:hover { background: #151f33; color: #e2e8f0; }
    .conv-item.active { background: #1e293b; color: #fff; }
    .conv-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .conv-time { flex: none; color: #64748b; font-size: 10px; }
    .conv-del {
      flex: none; width: 20px; height: 20px; padding: 0; border: 0; border-radius: 5px;
      background: transparent; color: #64748b; font-size: 15px; line-height: 1;
      visibility: hidden;
    }
    .conv-item:hover .conv-del { visibility: visible; }
    .conv-del:hover { background: #334155; color: #fca5a5; }
    .conv-empty { padding: 8px 10px; color: #64748b; font-size: 12px; }
    .side-foot { border-top: 1px solid #1e293b; padding-top: 10px; }
    .token-btn {
      display: flex; align-items: center; gap: 8px; width: 100%;
      padding: 7px 8px; border: 0; border-radius: 8px; background: transparent;
      color: #94a3b8; font-size: 12px; text-align: left;
    }
    .token-btn:hover { background: #151f33; color: #e2e8f0; }
    .dot { width: 8px; height: 8px; flex: none; border-radius: 50%; background: #64748b; }
    .dot.ok { background: #22c55e; box-shadow: 0 0 0 3px rgba(34, 197, 94, .14); }
    .dot.warn { background: #f59e0b; box-shadow: 0 0 0 3px rgba(245, 158, 11, .14); }
    .token-gear { margin-left: auto; color: #64748b; }
    .side-note { padding: 7px 8px 0; color: #64748b; font-size: 10.5px; line-height: 1.6; }

    /* ---------- main shell ---------- */
    .main { display: flex; flex-direction: column; min-width: 0; background: var(--bg); }
    .topbar {
      flex: none; display: flex; align-items: center; gap: 12px;
      height: 64px; padding: 0 24px; border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, .88); backdrop-filter: blur(10px);
    }
    .top-title { min-width: 0; }
    #page-title { font-size: 16px; font-weight: 700; letter-spacing: .1px; }
    .sub { margin-top: 1px; color: var(--muted); font-size: 12px; }
    .top-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .pill {
      padding: 5px 10px; border: 1px solid var(--line); border-radius: 999px;
      background: #eef2f7; color: #475569; font-size: 11.5px; white-space: nowrap;
    }
    .menu-btn { display: none !important; }
    .icon-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 34px; height: 34px; padding: 0; border: 0; border-radius: 8px;
      background: transparent; color: var(--muted); font-size: 20px; line-height: 1;
    }
    .icon-btn:hover { background: #eef2f7; color: var(--ink); }
    .banner {
      display: flex; align-items: center; gap: 12px; margin: 12px 24px 0;
      padding: 9px 13px; border: 1px solid #fde68a; border-radius: 10px;
      background: #fffbeb; color: #92400e; font-size: 13px;
    }
    .banner button {
      margin-left: auto; border: 0; border-radius: 7px; padding: 5px 10px;
      background: #b45309; color: #fff; font-size: 12px;
    }

    /* ---------- pages ---------- */
    .page { display: none; flex: 1; min-height: 0; }
    .page.active { display: flex; flex-direction: column; }
    #page-bank.active, #page-practice.active, #page-knowledge.active { display: block; overflow-y: auto; }
    .page-inner { width: 100%; max-width: 1000px; margin: 0 auto; padding: 24px; }
    .page-inner.narrow { max-width: 780px; }

    /* ---------- chat ---------- */
    #page-chat { overflow: hidden; }
    .messages { flex: 1; overflow-y: auto; padding: 26px 24px 8px; scroll-behavior: smooth; }
    .messages::-webkit-scrollbar { width: 7px; }
    .messages::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 6px; }
    .msg { width: 100%; max-width: 860px; margin: 0 auto 18px; }
    .msg.user { display: flex; justify-content: flex-end; }
    .user-bubble {
      max-width: 78%; padding: 11px 15px; border-radius: 16px 16px 4px 16px;
      background: var(--brand); color: #fff; white-space: pre-wrap; word-break: break-word;
      box-shadow: 0 3px 10px rgba(37, 99, 235, .16);
    }
    .msg.bot { display: flex; align-items: flex-start; gap: 10px; }
    .avatar {
      display: grid; place-items: center; flex: none; width: 30px; height: 30px;
      margin-top: 2px; border-radius: 9px; background: #dbeafe; color: #1d4ed8;
      font-size: 10px; font-weight: 800;
    }
    .bot-body { flex: 1; min-width: 0; }
    .badge-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 7px; }
    .badge {
      padding: 3px 8px; border-radius: 999px; background: #ecfdf5; color: var(--ok);
      font-size: 11px; font-weight: 600;
    }
    .badge.no { background: #fffbeb; color: var(--warn); }
    .badge.neutral { background: #eef2ff; color: #4338ca; }
    .badge.err { background: #fef2f2; color: var(--danger); }
    .badge-meta { color: var(--muted); font-size: 11px; }
    .answer-card {
      padding: 14px 16px; border: 1px solid var(--line);
      border-radius: 4px 14px 14px 14px; background: var(--card);
      box-shadow: 0 1px 2px rgba(15, 23, 42, .04);
    }
    .answer-text { white-space: pre-wrap; word-break: break-word; line-height: 1.75; }
    .section-title {
      margin: 14px 0 6px; color: var(--muted); font-size: 10.5px;
      font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    }
    .section-title:first-child { margin-top: 0; }
    .cite {
      margin: 7px 0; padding: 8px 11px; border-left: 3px solid var(--brand);
      border-radius: 0 8px 8px 0; background: #f8faff; font-size: 13px; line-height: 1.65;
    }
    .cite-head { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
    .cite-id { color: var(--brand); font-size: 12px; font-weight: 700; }
    .cite-quote { color: #334155; }
    .link-btn {
      padding: 0; border: 0; background: transparent; color: var(--brand);
      font-size: 12px; text-decoration: none;
    }
    .link-btn:hover { text-decoration: underline; }
    details { margin-top: 10px; }
    summary {
      color: var(--muted); font-size: 12px; font-weight: 600;
      cursor: pointer; list-style: none;
    }
    summary::-webkit-details-marker { display: none; }
    summary::before {
      content: "▸"; display: inline-block; margin-right: 5px;
      transition: transform .15s;
    }
    details[open] > summary::before { transform: rotate(90deg); }
    .hit-list { margin-top: 7px; border-top: 1px solid var(--line); }
    .hit-item {
      display: flex; align-items: flex-start; gap: 9px;
      padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 13px;
    }
    .hit-score { flex: none; color: var(--muted); font-size: 10.5px; white-space: nowrap; padding-top: 2px; }
    .hit-main { flex: 1; min-width: 0; }
    .hit-stem { color: #334155; line-height: 1.55; }
    .hit-meta { color: var(--muted); font-size: 10.5px; margin-top: 1px; }
    .hit-item button {
      display: block; width: 100%; padding: 0; border: 0; background: transparent;
      color: inherit; text-align: left;
    }
    .trace {
      margin-top: 7px; padding: 7px 10px; border: 1px solid var(--line);
      border-radius: 9px; background: #f8fafc;
    }
    .trace-row { display: flex; gap: 8px; padding: 4px 0; font-size: 12px; }
    .trace-name { width: 64px; flex: none; color: #475569; font-weight: 600; }
    .trace-ms { width: 48px; flex: none; color: var(--muted); text-align: right; }
    .trace-detail { flex: 1; min-width: 0; color: #64748b; word-break: break-word; }
    .rewrite { margin-top: 8px; color: var(--muted); font-size: 11.5px; }
    .rewrite b { color: #475569; font-weight: 600; }
    .typing {
      display: flex; align-items: center; gap: 9px; width: fit-content;
      padding: 11px 14px; border: 1px solid var(--line);
      border-radius: 4px 14px 14px 14px; background: var(--card);
      color: var(--muted); font-size: 13px;
    }
    .spinner {
      width: 14px; height: 14px; flex: none; border: 2px solid var(--line);
      border-top-color: var(--brand); border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .empty {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100%; padding: 40px 20px; text-align: center;
    }
    .logo-lg {
      display: grid; place-items: center; width: 58px; height: 58px; margin-bottom: 16px;
      border-radius: 17px; background: linear-gradient(135deg, #dbeafe, #bfdbfe);
      color: #1d4ed8; font-size: 16px; font-weight: 800; letter-spacing: .5px;
      box-shadow: 0 8px 24px rgba(37, 99, 235, .12);
    }
    .empty h2 { margin: 0 0 7px; font-size: 21px; letter-spacing: .2px; }
    .empty p { max-width: 520px; margin: 0; color: var(--muted); font-size: 13.5px; line-height: 1.75; }
    .examples { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 20px; }
    .example {
      padding: 7px 12px; border: 1px solid var(--line); border-radius: 999px;
      background: var(--card); color: #334155; font-size: 12.5px;
      transition: border-color .15s, color .15s;
    }
    .example:hover { border-color: #93c5fd; color: var(--brand); }
    .empty-note { margin-top: 18px; color: #94a3b8; font-size: 11.5px; }

    .composer-wrap {
      flex: none; padding: 10px 24px 16px;
      background: linear-gradient(180deg, rgba(245, 247, 251, 0), var(--bg) 30%);
    }
    .composer {
      display: flex; align-items: flex-end; gap: 8px; width: 100%; max-width: 860px;
      margin: 0 auto; padding: 8px 8px 8px 14px;
      border: 1px solid var(--line); border-radius: 14px; background: var(--card);
      box-shadow: 0 6px 20px rgba(15, 23, 42, .06);
      transition: border-color .15s, box-shadow .15s;
    }
    .composer:focus-within {
      border-color: #93c5fd;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, .11), 0 6px 20px rgba(15, 23, 42, .06);
    }
    .composer textarea {
      flex: 1; min-height: 28px; max-height: 150px; padding: 5px 0;
      border: 0; outline: 0; background: transparent; color: var(--ink);
      line-height: 1.55; resize: none;
    }
    .composer textarea::placeholder { color: #94a3b8; }
    .send {
      flex: none; padding: 8px 17px; border: 0; border-radius: 9px;
      background: var(--brand); color: #fff; font-size: 14px; font-weight: 600;
    }
    .send:hover { background: var(--brand-dark); }
    .send:disabled { opacity: .5; cursor: wait; }
    .composer-hint {
      max-width: 860px; margin: 6px auto 0; color: var(--muted);
      font-size: 10.5px; text-align: center;
    }

    /* ---------- bank ---------- */
    .bank-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
    .search { position: relative; flex: 1; min-width: 240px; }
    .search input {
      width: 100%; padding: 10px 36px 10px 13px; border: 1px solid var(--line);
      border-radius: 10px; background: var(--card); outline: 0;
    }
    .search input:focus { border-color: #93c5fd; box-shadow: 0 0 0 3px rgba(59, 130, 246, .1); }
    .search-ico {
      position: absolute; right: 13px; top: 50%; transform: translateY(-50%);
      color: var(--muted); font-size: 16px; pointer-events: none;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      padding: 6px 11px; border: 1px solid var(--line); border-radius: 999px;
      background: var(--card); color: #475569; font-size: 12px;
    }
    .chip:hover { border-color: #93c5fd; color: var(--brand); }
    .chip.active { border-color: var(--brand-dark); background: var(--brand-dark); color: #fff; }
    .bank-meta { margin: 2px 0 12px; color: var(--muted); font-size: 12px; }
    .bank-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .q-card {
      padding: 14px; border: 1px solid var(--line); border-radius: 12px;
      background: var(--card); cursor: pointer;
      transition: border-color .15s, transform .15s, box-shadow .15s;
    }
    .q-card:hover {
      border-color: #93c5fd; transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(15, 23, 42, .06);
    }
    .q-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
    .q-id { color: var(--brand); font-size: 11.5px; font-weight: 700; }
    .q-tag {
      padding: 1px 7px; border-radius: 999px; background: #f1f5f9;
      color: #64748b; font-size: 10.5px;
    }
    .q-stem {
      display: -webkit-box; overflow: hidden; -webkit-line-clamp: 3;
      -webkit-box-orient: vertical; color: #334155; font-size: 13.5px;
      line-height: 1.65; white-space: pre-wrap;
    }
    .empty-row { grid-column: 1 / -1; padding: 54px 0; color: var(--muted); text-align: center; font-size: 13.5px; }
    .center { margin: 18px 0; text-align: center; }
    .ghost {
      padding: 8px 16px; border: 1px solid var(--line); border-radius: 9px;
      background: var(--card); color: #334155; font-size: 13px;
    }
    .ghost:hover { border-color: #93c5fd; color: var(--brand); }
    .primary {
      padding: 8px 16px; border: 0; border-radius: 9px;
      background: var(--brand); color: #fff; font-size: 13px; font-weight: 600;
    }
    .primary:hover { background: var(--brand-dark); }
    .primary:disabled, .ghost:disabled { opacity: .55; cursor: wait; }

    /* ---------- practice ---------- */
    .practice-top {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; flex-wrap: wrap; margin-bottom: 12px;
    }
    .practice-stats { display: flex; flex-wrap: wrap; gap: 8px; }
    .selects { display: flex; flex-wrap: wrap; gap: 8px; }
    .stat {
      padding: 6px 10px; border: 1px solid var(--line); border-radius: 9px;
      background: var(--card); color: var(--muted); font-size: 11.5px;
    }
    .stat b { color: var(--ink); font-size: 12.5px; }
    .select {
      padding: 7px 10px; border: 1px solid var(--line); border-radius: 9px;
      background: var(--card); color: #334155; font-size: 12.5px; outline: 0;
    }
    .practice-card {
      padding: 20px; border: 1px solid var(--line); border-radius: 14px;
      background: var(--card); box-shadow: 0 1px 2px rgba(15, 23, 42, .04);
    }
    .practice-card h2 {
      margin: 7px 0 14px; font-size: 16px; line-height: 1.75;
      font-weight: 600; white-space: pre-wrap;
    }
    .opt {
      display: flex; gap: 8px; margin: 7px 0; padding: 9px 11px;
      border: 1px solid var(--line); border-radius: 9px; font-size: 13.5px;
      white-space: pre-wrap; line-height: 1.6;
    }
    .opt.correct { border-color: #86efac; background: #f0fdf4; }
    .opt-letter { flex: none; color: var(--brand); font-weight: 700; }
    .answer-box {
      margin-top: 14px; padding: 12px 13px; border: 1px dashed #cbd5e1;
      border-radius: 10px; background: #f8fafc;
    }
    .detail-answer { color: var(--ok); font-weight: 700; }
    .analysis {
      margin-top: 4px; color: #334155; font-size: 13.5px;
      line-height: 1.75; white-space: pre-wrap;
    }
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .ok-btn { background: #047857; }
    .ok-btn:hover { background: #065f46; }
    .no-btn { background: #b45309; }
    .no-btn:hover { background: #92400e; }
    .practice-note { margin-top: 8px; color: var(--muted); font-size: 11.5px; }
    .practice-empty { padding: 46px 10px; color: var(--muted); text-align: center; font-size: 13.5px; }
    .practice-tabs { display: flex; gap: 6px; margin-bottom: 12px; }
    .ptab {
      display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px;
      border: 1px solid var(--line); border-radius: 9px; background: var(--card);
      color: #475569; font-size: 12.5px;
    }
    .ptab:hover { border-color: #93c5fd; color: var(--brand); }
    .ptab.active { border-color: var(--brand); background: var(--brand); color: #fff; font-weight: 600; }
    .ptab-count {
      min-width: 18px; padding: 0 5px; border-radius: 9px; background: #eff6ff;
      color: var(--brand); font-size: 10.5px; line-height: 18px; text-align: center;
    }
    .ptab.active .ptab-count { background: rgba(255, 255, 255, .22); color: #fff; }
    .mastery-panel {
      margin-bottom: 14px; padding: 14px 15px; border: 1px solid var(--line);
      border-radius: 12px; background: var(--card);
    }
    .mastery-head {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 10px; flex-wrap: wrap; margin-bottom: 10px;
    }
    .mastery-head b { font-size: 14px; }
    .mastery-head span { color: var(--muted); font-size: 11px; }
    .mastery-row {
      display: grid; grid-template-columns: 96px minmax(0, 1fr) 58px;
      gap: 10px; align-items: center; margin-top: 7px;
    }
    .mastery-label { color: #475569; font-size: 11.5px; }
    .mastery-track {
      height: 7px; border-radius: 999px; background: #e8eefb; overflow: hidden;
    }
    .mastery-fill { height: 100%; border-radius: 999px; background: var(--brand); }
    .mastery-value { color: var(--muted); font-size: 11px; text-align: right; white-space: nowrap; }
    .wrong-list { display: flex; flex-direction: column; gap: 8px; }
    .wrong-row {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 12px; padding: 12px 14px; border: 1px solid var(--line);
      border-radius: 11px; background: var(--card);
    }
    .wrong-main { flex: 1; min-width: 0; cursor: pointer; }
    .wrong-main:hover .wrong-stem { color: var(--brand); }
    .wrong-meta {
      display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
      color: var(--muted); font-size: 11px; margin-bottom: 4px;
    }
    .wrong-stem {
      display: -webkit-box; overflow: hidden; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; color: #334155; font-size: 13px;
      line-height: 1.6; white-space: pre-wrap;
    }
    .wrong-actions { display: flex; gap: 6px; flex: none; }
    .wrong-actions .ghost { padding: 6px 11px; font-size: 12px; }
    .quiz-opt { width: 100%; background: var(--card); color: inherit; text-align: left; }
    .quiz-opt:hover { border-color: #93c5fd; }
    .quiz-opt.selected { border-color: #93c5fd; background: #eff6ff; }
    .quiz-opt.wrong-opt { border-color: #fca5a5; background: #fef2f2; }
    .quiz-opt:disabled { cursor: default; color: inherit; }
    .quiz-score { margin: 4px 0 2px; font-size: 30px; font-weight: 700; color: var(--brand); }
    .quiz-sub { color: var(--muted); font-size: 12.5px; }
    .wrong-empty {
      padding: 34px 12px; border: 1px dashed var(--line); border-radius: 12px;
      color: var(--muted); font-size: 13px; text-align: center; background: var(--card);
    }

    /* ---------- knowledge ---------- */
    .knowledge-layout {
      display: grid; grid-template-columns: 190px minmax(0, 1fr);
      gap: 18px; align-items: start;
    }
    .knowledge-layout.no-nav { grid-template-columns: minmax(0, 1fr); }
    .chapter-nav {
      position: sticky; top: 0; display: flex; flex-direction: column; gap: 3px;
      padding: 5px; border: 1px solid var(--line); border-radius: 12px; background: var(--card);
    }
    .chapter-btn {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      width: 100%; padding: 7px 9px; border: 0; border-radius: 8px;
      background: transparent; color: #475569; font-size: 12.5px; text-align: left;
    }
    .chapter-btn:hover { background: #f1f5f9; color: var(--brand); }
    .chapter-btn.active { background: #e0ecff; color: var(--brand-dark); font-weight: 600; }
    .chapter-count { color: var(--muted); font-size: 10.5px; }
    .k-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .k-card {
      display: flex; flex-direction: column; gap: 5px; padding: 14px;
      border: 1px solid var(--line); border-radius: 12px; background: var(--card);
      cursor: pointer; transition: border-color .15s, transform .15s, box-shadow .15s;
    }
    .k-card:hover {
      border-color: #93c5fd; transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(15, 23, 42, .06);
    }
    .k-title { font-size: 14.5px; font-weight: 700; line-height: 1.45; }
    .k-summary {
      display: -webkit-box; overflow: hidden; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; color: var(--muted);
      font-size: 12.5px; line-height: 1.6;
    }
    .k-foot { margin-top: auto; padding-top: 5px; color: var(--muted); font-size: 10.5px; }
    .k-tag { background: #eef2ff; color: #4338ca; }
    .k-body { margin: 4px 0 12px; color: #334155; font-size: 14px; line-height: 1.85; white-space: pre-wrap; }
    .k-formula {
      margin: 5px 0; padding: 8px 10px; border-left: 3px solid #93c5fd;
      border-radius: 0 7px 7px 0; background: #f8faff; font-size: 13px;
      white-space: pre-wrap; word-break: break-word;
    }
    .k-pitfall {
      margin-top: 12px; padding: 10px 12px; border: 1px solid #fde68a;
      border-radius: 9px; background: #fffbeb; color: #92400e;
      font-size: 13px; line-height: 1.7; white-space: pre-wrap;
    }
    .related-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 4px; }
    .related-q {
      display: block; width: 100%; margin: 5px 0; padding: 8px 10px;
      border: 1px solid var(--line); border-radius: 9px; background: #f8fafc;
      color: #334155; font-size: 13px; line-height: 1.55; text-align: left;
    }
    .related-q:hover { border-color: #93c5fd; color: var(--brand); }
    .related-q b { margin-right: 6px; color: var(--brand); font-weight: 700; }
    .topic-banner {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      margin-bottom: 12px; padding: 9px 12px; border: 1px solid #c7d2fe;
      border-radius: 10px; background: #eef2ff; color: #3730a3; font-size: 12.5px;
    }
    .topic-banner .link-btn { margin-left: auto; }

    /* ---------- modal / toast ---------- */
    .modal {
      position: fixed; inset: 0; z-index: 50; display: flex;
      align-items: center; justify-content: center; padding: 20px;
      background: rgba(15, 23, 42, .5);
    }
    .modal-card {
      display: flex; flex-direction: column; width: min(760px, 100%);
      max-height: min(86vh, 900px); border-radius: 16px; background: #fff;
      box-shadow: 0 24px 70px rgba(15, 23, 42, .3);
    }
    .modal-head {
      display: flex; align-items: center; gap: 12px; flex: none;
      padding: 14px 18px; border-bottom: 1px solid var(--line);
    }
    .modal-title { flex: 1; font-size: 15px; font-weight: 700; }
    .modal-body { padding: 18px; overflow-y: auto; }
    .detail-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 11px; }
    .detail-stem { margin-bottom: 14px; font-size: 15px; line-height: 1.8; white-space: pre-wrap; }
    .detail-opt {
      margin: 5px 0; padding: 7px 10px; border: 1px solid transparent;
      border-radius: 8px; background: #f8fafc; font-size: 13.5px; white-space: pre-wrap;
    }
    .detail-opt.correct { border-color: #86efac; background: #f0fdf4; }
    .source-line { margin-top: 12px; color: var(--muted); font-size: 11.5px; }
    .warn-box {
      margin-top: 12px; padding: 9px 11px; border: 1px solid #fde68a;
      border-radius: 9px; background: #fffbeb; color: #92400e; font-size: 12px;
    }
    .settings-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .settings-row label { color: #475569; font-size: 12px; font-weight: 600; }
    .settings-row input {
      width: 100%; padding: 9px 11px; border: 1px solid var(--line);
      border-radius: 9px; outline: 0;
    }
    .settings-row input:focus { border-color: #93c5fd; box-shadow: 0 0 0 3px rgba(59, 130, 246, .1); }
    .settings-status { min-height: 20px; margin-top: 10px; color: var(--ok); font-size: 12px; }
    .settings-status.err { color: var(--danger); }
    .settings-note { margin-top: 12px; color: var(--muted); font-size: 11.5px; line-height: 1.7; }
    .toast {
      position: fixed; left: 50%; bottom: 28px; z-index: 60; transform: translateX(-50%);
      max-width: min(420px, calc(100vw - 40px)); padding: 10px 16px;
      border-radius: 10px; background: #0f172a; color: #fff;
      font-size: 13px; box-shadow: 0 10px 30px rgba(15, 23, 42, .25);
    }
    .toast.err { background: #7f1d1d; }
    .scrim { display: none; }

    @media (max-width: 860px) {
      .app { grid-template-columns: 1fr; }
      .sidebar {
        position: fixed; inset: 0 auto 0 0; z-index: 40; width: 268px;
        transform: translateX(-100%); transition: transform .2s ease;
      }
      .sidebar.open { transform: none; }
      .scrim { position: fixed; inset: 0; z-index: 30; background: rgba(15, 23, 42, .42); }
      .scrim.show { display: block; }
      .menu-btn { display: inline-flex !important; }
      .topbar { height: 60px; padding: 0 14px; }
      #page-title { font-size: 15px; }
      .sub { font-size: 11px; }
      .top-actions .pill { padding: 4px 8px; font-size: 10.5px; }
      .banner { margin: 10px 14px 0; }
      .messages { padding: 18px 14px 6px; }
      .msg { margin-bottom: 15px; }
      .user-bubble { max-width: 88%; }
      .composer-wrap { padding: 8px 14px 14px; }
      .composer-hint { font-size: 10px; }
      .page-inner { padding: 16px; }
      .bank-list { grid-template-columns: 1fr; }
      .knowledge-layout { grid-template-columns: minmax(0, 1fr); gap: 10px; }
      .chapter-nav {
        position: static; flex-direction: row; overflow-x: auto; padding: 4px;
      }
      .chapter-btn { width: auto; white-space: nowrap; }
      .k-list { grid-template-columns: 1fr; }
      .mastery-row { grid-template-columns: 82px minmax(0, 1fr) 52px; }
      .wrong-row { flex-direction: column; }
      .wrong-actions { width: 100%; }
      .modal { padding: 12px; }
      .modal-body { padding: 14px; }
    }
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">408</div>
      <div>
        <h1>真题知识库</h1>
        <p>RAG · 引用可核对</p>
      </div>
    </div>
    <button class="new-chat" id="new-chat">＋ 新建对话</button>
    <nav class="nav" id="nav">
      <button data-page="chat" class="active"><span class="nav-ico">◉</span>问答</button>
      <button data-page="bank"><span class="nav-ico">▤</span>题库</button>
      <button data-page="knowledge"><span class="nav-ico">▦</span>知识库</button>
      <button data-page="practice"><span class="nav-ico">✎</span>练习</button>
    </nav>
    <div class="side-section">
      <div class="side-title">最近对话</div>
      <div class="conv-list" id="conv-list"></div>
    </div>
    <div class="side-foot">
      <button class="token-btn" id="settings-btn">
        <span class="dot" id="token-dot"></span>
        <span id="token-label">未配置口令</span>
        <span class="token-gear">⚙</span>
      </button>
      <div class="side-note"><span id="side-facts">正在读取题库…</span><br>未覆盖的问题会明确拒答</div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menu-btn" aria-label="打开菜单">☰</button>
      <div class="top-title">
        <div id="page-title">真题问答</div>
        <div class="sub" id="page-sub">多轮追问 · 每条结论都可核对</div>
      </div>
      <div class="top-actions"><span class="pill" id="health-pill">连接中…</span></div>
    </header>

    <div class="banner" id="auth-banner" hidden>
      <span>这个站点需要访问口令。</span>
      <button id="auth-open">输入口令</button>
    </div>

    <section class="page active" id="page-chat">
      <div class="messages" id="messages"></div>
      <div class="composer-wrap">
        <div class="composer">
          <textarea id="composer" rows="1" maxlength="500"
                    placeholder="问题目或知识点，例如：CSMA/CD 最小帧长怎么算"></textarea>
          <button class="send" id="send">发送</button>
        </div>
        <div class="composer-hint">Enter 发送 · Shift+Enter 换行 · 答案只引用真题或考点原文</div>
      </div>
    </section>

    <section class="page" id="page-bank">
      <div class="page-inner">
        <div class="bank-head">
          <div class="search">
            <input id="bank-q" placeholder="搜索题干、选项、题号或科目…">
            <span class="search-ico">⌕</span>
          </div>
          <div class="chips" id="bank-subjects"></div>
          <div class="chips" id="bank-years"></div>
        </div>
        <div class="bank-meta" id="bank-meta"></div>
        <div class="bank-list" id="bank-list"></div>
        <div class="center"><button class="ghost" id="bank-more" hidden>加载更多</button></div>
      </div>
    </section>

    <section class="page" id="page-knowledge">
      <div class="page-inner">
        <div class="bank-head">
          <div class="search">
            <input id="kn-q" placeholder="搜索考点标题、正文、公式或章节…">
            <span class="search-ico">⌕</span>
          </div>
          <div class="chips" id="kn-subjects"></div>
        </div>
        <div class="bank-meta" id="kn-meta"></div>
        <div class="knowledge-layout" id="kn-layout">
          <aside class="chapter-nav" id="kn-chapters" hidden></aside>
          <div class="knowledge-main">
            <div class="k-list" id="kn-list"></div>
            <div class="center"><button class="ghost" id="kn-more" hidden>加载更多</button></div>
          </div>
        </div>
      </div>
    </section>

    <section class="page" id="page-practice">
      <div class="page-inner narrow">
        <div class="practice-tabs" id="practice-tabs">
          <button class="ptab active" data-mode="drill">随机练习</button>
          <button class="ptab" data-mode="wrong">错题本 <span class="ptab-count" id="wrong-count">0</span></button>
          <button class="ptab" data-mode="quiz">10 题小测</button>
        </div>
        <div id="practice-drill">
          <div class="topic-banner" id="practice-topic" hidden>
            <span id="practice-topic-text"></span>
            <button class="link-btn" id="practice-topic-exit">退出本轮练习</button>
          </div>
          <div class="practice-top">
            <div class="practice-stats" id="practice-stats"></div>
            <div class="selects">
              <select class="select" id="practice-year" aria-label="练习年份"></select>
              <select class="select" id="practice-subject" aria-label="练习科目"></select>
            </div>
          </div>
          <div id="practice-card"></div>
        </div>
        <div id="practice-wrong" hidden>
          <div class="mastery-panel" id="mastery-panel"></div>
          <div class="practice-top">
            <div class="practice-stats" id="wrong-stats"></div>
            <button class="ghost" id="wrong-redo">重练全部错题</button>
          </div>
          <div class="wrong-list" id="wrong-list"></div>
        </div>
        <div id="practice-quiz" hidden>
          <div class="practice-top">
            <div class="practice-stats" id="quiz-stats"></div>
            <div class="selects">
              <select class="select" id="quiz-year" aria-label="小测年份"></select>
              <select class="select" id="quiz-subject" aria-label="小测科目"></select>
            </div>
          </div>
          <div id="quiz-card"></div>
        </div>
      </div>
    </section>
  </main>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true">
    <div class="modal-head">
      <div class="modal-title" id="modal-title"></div>
      <button class="icon-btn" id="modal-close" aria-label="关闭">×</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function () {
  'use strict';

  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  };

  const TOKEN_KEY = '408-access-token';
  const CONV_KEY = '408-conversations-v1';
  const ACTIVE_KEY = '408-active-conv-v1';
  const STATS_KEY = '408-practice-stats-v1';
  const HISTORY_KEY = '408-practice-history-v1';
  const SUBJECT_FALLBACK = {
    ds: '数据结构', co: '计算机组成原理', os: '操作系统', cn: '计算机网络', '': '未分类'
  };
  const PAGE_META = {
    chat: {title: '真题问答', sub: '多轮追问 · 每条结论都可核对'},
    bank: {title: '题库', sub: '按年份和科目浏览真题'},
    knowledge: {title: '考点知识库', sub: '四科考点卡片 · 与真题双向关联'},
    practice: {title: '练习', sub: '按年份科目练习 · 错题本与掌握度'}
  };

  function loadJSON(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      if (!raw) return fallback;
      const val = JSON.parse(raw);
      return val == null ? fallback : val;
    } catch (e) {
      return fallback;
    }
  }

  function loadHistory() {
    const val = loadJSON(HISTORY_KEY, {});
    return (val && typeof val === 'object' && !Array.isArray(val)) ? val : {};
  }

  const state = {
    page: 'chat',
    token: localStorage.getItem(TOKEN_KEY) || '',
    health: null,
    meta: null,
    conversations: loadJSON(CONV_KEY, []),
    activeId: localStorage.getItem(ACTIVE_KEY) || '',
    sending: false,
    loadingStart: 0,
    loadingTimer: null,
    bank: {q: '', subject: '', year: '', items: [], total: 0, offset: 0, loading: false},
    knowledge: {q: '', subject: '', chapter: '', items: [], total: 0, offset: 0,
                loading: false, subjects: [], chapters: []},
    practice: {subject: '', year: '', current: null, detail: null, revealed: false,
               assessed: null, list: [], queue: null, topic: '', mode: 'drill',
               history: loadHistory(), map: null, quiz: null, quizSubject: '',
               quizYear: ''},
    modalId: '',
    stats: loadJSON(STATS_KEY, {seen: 0, known: 0, unknown: 0})
  };

  if (!state.activeId || !state.conversations.some(c => c.id === state.activeId)) {
    state.activeId = state.conversations.length ? state.conversations[0].id : '';
  }

  function activeConv() {
    return state.conversations.find(c => c.id === state.activeId) || null;
  }

  function saveConvs() {
    try {
      localStorage.setItem(CONV_KEY, JSON.stringify(state.conversations.slice(0, 20)));
    } catch (e) {
      state.conversations = state.conversations.slice(0, 10).map(c => ({
        ...c, messages: c.messages.slice(-20)
      }));
      try {
        localStorage.setItem(CONV_KEY, JSON.stringify(state.conversations));
      } catch (e2) {
        toast('本机存储空间不足，部分旧对话没有保存', 'err');
      }
    }
    localStorage.setItem(ACTIVE_KEY, state.activeId || '');
  }

  function saveStats() {
    try { localStorage.setItem(STATS_KEY, JSON.stringify(state.stats)); } catch (e) {}
  }

  function saveHistory() {
    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(state.practice.history)); }
    catch (e) { toast('本机存储空间不足，练习记录没有保存', 'err'); }
  }

  async function api(path, opts, tokenOverride) {
    const options = Object.assign({}, opts || {});
    const headers = Object.assign({}, options.headers || {});
    const token = tokenOverride !== undefined ? tokenOverride : state.token;
    if (token) headers['X-Access-Token'] = token;
    if (options.body && typeof options.body !== 'string') {
      headers['Content-Type'] = 'application/json';
      options.body = JSON.stringify(options.body);
    }
    options.headers = headers;
    const resp = await fetch(path, options);
    let data = null;
    try { data = await resp.json(); } catch (e) {}
    if (!resp.ok) {
      const err = new Error((data && data.detail) || ('HTTP ' + resp.status));
      err.status = resp.status;
      err.data = data;
      throw err;
    }
    return data;
  }

  let toastTimer = null;
  function toast(msg, kind) {
    const box = $('#toast');
    box.textContent = msg;
    box.className = 'toast' + (kind ? ' ' + kind : '');
    box.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { box.hidden = true; }, 3600);
  }

  function subjectLabel(key, fallback) {
    if (key === 'none') return '未分类';
    if (state.meta) {
      const hit = state.meta.subjects.find(s => s.key === key);
      if (hit) return hit.label;
    }
    return fallback || SUBJECT_FALLBACK[key] || key || '未分类';
  }

  function typeLabel(type) {
    return type === 'comprehensive' ? '综合题' : '选择题';
  }

  function isKnowledge(item) {
    return !!item && item.kind === 'knowledge';
  }

  function openSource(item) {
    const id = item.chunk_id || item.id;
    if (!id) return;
    if (isKnowledge(item)) openKnowledge(id);
    else openQuestion(id);
  }

  /* ---------- sidebar / auth ---------- */
  function renderToken() {
    const dot = $('#token-dot');
    const label = $('#token-label');
    const banner = $('#auth-banner');
    const h = state.health;
    if (!h) {
      dot.className = 'dot warn';
      label.textContent = '连接中…';
      banner.hidden = true;
      return;
    }
    if (!h.auth_required) {
      dot.className = 'dot ok';
      label.textContent = '无需口令';
      banner.hidden = true;
      return;
    }
    if (state.token) {
      dot.className = 'dot ok';
      label.textContent = '口令已配置';
      banner.hidden = true;
    } else {
      dot.className = 'dot warn';
      label.textContent = '未配置口令';
      banner.hidden = false;
    }
  }

  function showAuthNeeded(message) {
    if (state.token) {
      state.token = '';
      localStorage.removeItem(TOKEN_KEY);
    }
    renderToken();
    openSettings(message || '这个站点需要访问口令。');
  }

  async function loadHealth() {
    try {
      const h = await fetch('/health').then(r => r.json());
      state.health = h;
      const bits = [h.chunks + ' 题'];
      if (h.knowledge != null) bits.push(h.knowledge + ' 考点');
      bits.push(h.mode || '—');
      $('#health-pill').textContent = bits.join(' · ');
      renderToken();
      if (state.token || !h.auth_required) {
        try {
          state.meta = await api('/meta');
          renderSubjects();
          renderPracticeSubjects();
        } catch (e) {
          if (e.status === 401) showAuthNeeded('访问口令无效，请重新输入。');
        }
      }
    } catch (e) {
      $('#health-pill').textContent = '服务未连接';
      renderToken();
    }
  }

  function renderConvList() {
    const box = $('#conv-list');
    box.replaceChildren();
    if (!state.conversations.length) {
      box.appendChild(el('div', 'conv-empty', '还没有对话'));
      return;
    }
    state.conversations.forEach(conv => {
      const item = el('div', 'conv-item' + (conv.id === state.activeId ? ' active' : ''));
      item.appendChild(el('div', 'conv-title', conv.title || '新对话'));
      if (conv.updatedAt) {
        const d = new Date(conv.updatedAt);
        item.appendChild(el('div', 'conv-time',
          d.getMonth() + 1 + '/' + d.getDate()));
      }
      const del = el('button', 'conv-del', '×');
      del.title = '删除对话';
      del.addEventListener('click', ev => {
        ev.stopPropagation();
        deleteConversation(conv.id);
      });
      item.appendChild(del);
      item.addEventListener('click', () => {
        state.activeId = conv.id;
        localStorage.setItem(ACTIVE_KEY, state.activeId);
        if (state.page !== 'chat') go('chat');
        renderConvList();
        renderMessages();
        closeSidebar();
      });
      box.appendChild(item);
    });
  }

  function deleteConversation(id) {
    if (!window.confirm('删除这个对话？')) return;
    state.conversations = state.conversations.filter(c => c.id !== id);
    if (state.activeId === id) {
      state.activeId = state.conversations.length ? state.conversations[0].id : '';
    }
    saveConvs();
    renderConvList();
    renderMessages();
  }

  function newConversation() {
    const conv = {
      id: String(Date.now()) + Math.random().toString(16).slice(2, 8),
      title: '新对话',
      createdAt: Date.now(),
      updatedAt: Date.now(),
      messages: []
    };
    state.conversations.unshift(conv);
    state.activeId = conv.id;
    saveConvs();
    renderConvList();
    renderMessages();

    closeSidebar();
    const composer = $('#composer');

  function newChat() {
    const cur = activeConv();
    if (cur && cur.messages.length === 0) {
      if (state.page !== 'chat') go('chat');
      $('#composer').focus();
      closeSidebar();
      return;
    }
    newConversation();
  }

  function openSidebar() {

    $('#scrim').classList.add('show');

  function closeSidebar() {
    $('#sidebar').classList.remove('open');

  /* ---------- chat rendering ---------- */
  function emptyState() {

    wrap.appendChild(el('h2', null, '真题 + 考点，双库检索'));
