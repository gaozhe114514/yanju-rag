# 放到 /etc/nginx/conf.d/408-rag.conf
# conf.d/*.conf 本身就在 http {} 里，所以 limit_req_zone 可以直接写在文件顶部。
# 应用层已经有口令 + 每 IP 限流，这里是第二层：挡住明显的脚本刷量。

limit_req_zone $binary_remote_addr zone=ask_zone:10m rate=20r/m;

server {
    listen 80;
    server_name _;          # 有域名就改成你的域名，然后跑 certbot

    server_tokens off;
    client_max_body_size 32k;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # 问答接口共用限流；题库浏览（/chunks、/meta）不占这个额度
    location ~ ^/(ask|chat|chat/stream)$ {
        limit_req zone=ask_zone burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆盖而不是追加：应用取第一个值作为客户端 IP，追加会被伪造头绕过
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 流式回答（/chat/stream）：不缓冲，delta 才能边生成边到浏览器；
        # 应用层还会发 X-Accel-Buffering: no，两层都关才稳
        proxy_buffering off;
        proxy_cache off;
        # 首次请求要加载精排模型，给足时间
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆盖而不是追加：应用取第一个值作为客户端 IP，追加会被伪造头绕过
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
