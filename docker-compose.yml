services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?在 .env 里设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-rag}
    ports:
      # 只监听回环，方便本机 psql / SSH 隧道排查；公网连不上
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-rag}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      args:
        HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
    image: cs408-rag:latest
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      KB_INPUT: data/work/2019_draft.jsonl,data/work/2020_draft.jsonl,data/work/2021_draft.jsonl,data/work/2023_draft.jsonl,data/work/2024_draft.jsonl
      KB_MODE: ${KB_MODE:-hybrid-ce}
      KB_FUSE_K: ${KB_FUSE_K:-10}
      KB_CACHE_TTL: ${KB_CACHE_TTL:-86400}
      # 语料、向量、浏览查询都走 Postgres；进程内只留 BM25 和精排模型
      DATABASE_URL: postgresql://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-rag}
      # 放在 Nginx 后面，用 X-Forwarded-For 区分客户端 IP
      KB_TRUST_PROXY: "1"
      KB_GAP_LOG: /app/logs/gap_log.jsonl
      # 模型已烘进镜像，运行时禁止联网检查；否则国内网络会卡在 HF 握手
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    ports:
      # 只监听回环：公网流量必须经过 Nginx（TLS + 第二层限流），不能直连 8000
      - "127.0.0.1:8000:8000"
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 3

volumes:
  pgdata:
