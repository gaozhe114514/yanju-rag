name: tests

on:
  push:
    branches: [main]
  pull_request:

# 连着推几个提交时只跑最后那次，旧任务直接取消，
# 免得每推一次都跑一遍、每失败一次就发一封邮件。
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # 项目本体、Docker 镜像与开发环境统一到 Python 3.11；ubuntu-latest（24.04）
    # 的 setup-python 能直接装 3.11，不再需要为 3.9 退回 22.04。
    runs-on: ubuntu-latest
    env:
      # 强制 UTF-8，避免 runner 上非 UTF-8 输出编码把中文用例名或断言打崩。
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 单测可以依赖：标准库 + numpy + 文件解析要的几个纯 wheel。
      # openpyxl / python-docx 是表格抽取用例自己造 xlsx / docx 样本用的，
      # 和生产进料同一套解析库，不算额外引擎。
      # langgraph 是 Agent 状态图的纯 Python 运行时，图用例需要它；
      # 版本与 requirements.txt 一致，Agent 层先在 0.6 上验收，升 1.0 单独做。
      # langchain-core<1 是配套约束：0.6 的元数据允许 1.x，但只在 0.3.x 上验证过。
      # fastapi / torch / OCR 引擎仍然不许进单测：要么改成测纯函数，
      # 要么在用例里用 mock 把引擎挡掉（OCR 用例就是 mock 的）。
      # 曾经这里只装 numpy，知识库解析上线后一直红，就是漏了 pillow / bs4。
      - name: Install test deps
        run: python -m pip install "numpy<2" pillow beautifulsoup4 pypdf chardet openpyxl python-docx "langgraph>=0.6,<0.7" "langchain-core>=0.3,<1"
      # 红了先看这一步：版本对不上就能直接排除环境问题。
      # 本地等价复现：在 python:3.11-slim 容器里跑同样的两条命令。
      - name: Show environment
        run: |
          python -V
          python -c "import numpy, sys; print('numpy', numpy.__version__, '|', sys.platform)"
          python -m pip freeze
      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v
